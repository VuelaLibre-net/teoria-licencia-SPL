# Terminología ES→EN de la colección SPL.
#
# Fuente de verdad para la edición inglesa: cada término del glosario
# unificado (recursos-completo/glosario.qmd) con su equivalente inglés.
#
#   es       rótulo del glosario español, literal.
#   en       rótulo inglés que se usará en glossary.qmd y en el texto.
#   origen   glosario: el equivalente inglés ya figuraba en el rótulo ES.
#            propuesta: equivalente nuevo, pendiente de revisión.
#   libros   libros cuyo glosario contiene la entrada.
#   nota     decisión o duda terminológica.
#
# Criterios: ortografía británica y terminología EASA/ICAO (centre,
# licence, manoeuvre, mass en vez de weight); siglas oficiales intactas;
# nombres propios españoles (AESA, CIAIAC, DGAC) se conservan con glosa.
# Al revisar una propuesta, cambiar su origen a «revisado».

