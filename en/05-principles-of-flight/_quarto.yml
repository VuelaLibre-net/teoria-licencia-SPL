project:
  type: book
  output-dir: _book

lang: en
version: "0.8.0"
repo-url: "https://github.com/VuelaLibre-net/teoria-licencia-SPL"
cubierta: "cover/frente.png"
contracubierta: "cover/reverso.png"

book:
  title: "Principles of Flight"
  author: "VuelaLibre.net"
  chapters:
    - index.qmd
    - licence.qmd
    - dedication.qmd
    - epigraph.qmd
    - acknowledgements.qmd
    - introduction.qmd
    - cap01-aerodynamics-airflow.qmd
    - cap02-flight-mechanics.qmd
    - cap03-stability.qmd
    - cap04-control.qmd
    - cap05-limitations-load-factor-and-manoeuvres.qmd
    - cap06-stalling-and-spinning.qmd
    - cap07-spiral-dive.qmd
  appendices:
    - appendix-easa-syllabus-principles-of-flight.qmd
    - glossary.qmd
    - bibliography.qmd
    - colophon.qmd
    - back-cover.qmd

format:
  orange-book-es-typst:
    toc: true
    number-sections: true
    keep-typ: true
    margin:
      top: 2.5cm
      bottom: 2.5cm
  epub:
    # Los .qmd llevan la marca GUÍA-DE-LECTURA como comentario HTML, para el
    # editor. Typst los descarta solos; el EPUB los arrastraría al entregable.
    strip-comments: true
    toc: true
    epub-cover-image: cover/frente.png
    include-in-header: _extensions/orange-book-es/epub-estilos.html
