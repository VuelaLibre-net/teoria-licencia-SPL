project:
  type: book
  output-dir: _book

lang: en
version: "0.8.0"
repo-url: "https://github.com/VuelaLibre-net/teoria-licencia-SPL"
cubierta: "cover/frente.jpg"
contracubierta: "cover/reverso.jpg"

book:
  title: "Human Performance"
  author: "VuelaLibre.net"
  chapters:
    - index.qmd
    - licence.qmd
    - dedication.qmd
    - epigraph.qmd
    - acknowledgements.qmd
    - introduction.qmd
    - cap01-human-factors-basic-concepts.qmd
    - cap02-basic-aviation-physiology-and-health-maintenance.qmd
    - cap03-basic-aviation-psychology.qmd
    - cap04-use-of-oxygen.qmd
  appendices:
    - appendix-easa-syllabus-human-performance.qmd
    - glossary.qmd
    - bibliography.qmd
    - colophon.qmd
    - back-cover.qmd

format:
  orange-book-es-typst:
    toc: true
    number-sections: true
    keep-typ: true
    margin:
      top: 2.5cm
      bottom: 2.5cm
  epub:
    # Los .qmd llevan la marca GUÍA-DE-LECTURA como comentario HTML, para el
    # editor. Typst los descarta solos; el EPUB los arrastraría al entregable.
    strip-comments: true
    toc: true
    epub-cover-image: cover/frente.jpg
    include-in-header: _extensions/orange-book-es/epub-estilos.html
