project:
  type: book
  output-dir: _book

lang: en
version: "0.8.0"
repo-url: "https://github.com/VuelaLibre-net/teoria-licencia-SPL"
cubierta: "cover/frente.png"
contracubierta: "cover/reverso.png"

book:
  title: "Aircraft General Knowledge, Airframe, Systems and Emergency Equipment"
  author: "VuelaLibre.net"
  chapters:
    - index.qmd
    - licence.qmd
    - dedication.qmd
    - epigraph.qmd
    - acknowledgements.qmd
    - introduction.qmd
    - cap01-airframe.qmd
    - cap02-system-design-loads-and-stresses.qmd
    - cap03-landing-gear-wheels-tyres-and-brakes.qmd
    - cap04-mass-and-balance.qmd
    - cap05-flight-controls.qmd
    - cap06-instruments.qmd
    - cap07-rigging-of-aircraft-connection-of-control-surfaces.qmd
    - cap08-manuals-and-documents.qmd
    - cap09-airworthiness-and-maintenance.qmd
    - cap10-airframe-engines-and-propellers.qmd
    - cap11-water-ballast-systems.qmd
    - cap12-batteries-performance-and-operational-limitations.qmd
    - cap13-emergency-parachutes.qmd
    - cap14-emergency-bail-out-aid.qmd
  appendices:
    - appendix-easa-syllabus-aircraft-general-knowledge.qmd
    - glossary.qmd
    - bibliography.qmd
    - colophon.qmd
    - back-cover.qmd

format:
  orange-book-es-typst:
    toc: true
    number-sections: true
    keep-typ: true
    margin:
      top: 2.5cm
      bottom: 2.5cm
  epub:
    # Los .qmd llevan la marca GUÍA-DE-LECTURA como comentario HTML, para el
    # editor. Typst los descarta solos; el EPUB los arrastraría al entregable.
    strip-comments: true
    toc: true
    epub-cover-image: cover/frente.png
    include-in-header: _extensions/orange-book-es/epub-estilos.html
