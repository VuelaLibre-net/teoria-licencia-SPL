project:
  type: book
  output-dir: _book

lang: en
version: "0.8.1"
repo-url: "https://github.com/VuelaLibre-net/teoria-licencia-SPL"
cubierta: "cover/frente.png"
contracubierta: "cover/reverso.png"

book:
  title: "Operational Procedures"
  author: "VuelaLibre.net"
  chapters:
    - index.qmd
    - licence.qmd
    - dedication.qmd
    - epigraph.qmd
    - acknowledgements.qmd
    - introduction.qmd
    - cap01-general-requirements.qmd
    - cap02-launch-methods.qmd
    - cap03-soaring-techniques.qmd
    - cap04-circuits-and-landing.qmd
    - cap05-outlanding.qmd
    - cap06-special-operational-procedures-and-hazards.qmd
    - cap07-emergency-procedures.qmd
    - cap08-emergency-parachute-operation-and-landing.qmd
  appendices:
    - appendix-easa-syllabus-operational-procedures.qmd
    - glossary.qmd
    - bibliography.qmd
    - colophon.qmd
    - back-cover.qmd

format:
  orange-book-es-typst:
    toc: true
    number-sections: true
    keep-typ: true
    margin:
      top: 2.5cm
      bottom: 2.5cm
  epub:
    # Los .qmd llevan la marca GUÍA-DE-LECTURA como comentario HTML, para el
    # editor. Typst los descarta solos; el EPUB los arrastraría al entregable.
    strip-comments: true
    toc: true
    epub-cover-image: cover/frente.png
    include-in-header: _extensions/orange-book-es/epub-estilos.html
