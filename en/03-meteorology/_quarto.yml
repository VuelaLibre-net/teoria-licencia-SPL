project:
  type: book
  output-dir: _book

lang: en
version: "0.8.1"
repo-url: "https://github.com/VuelaLibre-net/teoria-licencia-SPL"
cubierta: "cover/frente.png"
contracubierta: "cover/reverso.png"

book:
  title: "Meteorology"
  author: "VuelaLibre.net"
  chapters:
    - index.qmd
    - licence.qmd
    - dedication.qmd
    - epigraph.qmd
    - acknowledgements.qmd
    - introduction.qmd
    - cap01-the-atmosphere.qmd
    - cap02-wind.qmd
    - cap03-thermodynamics.qmd
    - cap04-clouds-and-fog.qmd
    - cap05-precipitation.qmd
    - cap06-air-masses-and-fronts.qmd
    - cap07-pressure-systems.qmd
    - cap08-climatology.qmd
    - cap09-flight-hazards.qmd
    - cap10-meteorological-information.qmd
  appendices:
    - appendix-easa-syllabus-meteorology.qmd
    - appendix-soaring-weather-sources.qmd
    - glossary.qmd
    - bibliography.qmd
    - colophon.qmd
    - back-cover.qmd

format:
  orange-book-es-typst:
    toc: true
    number-sections: true
    keep-typ: true
    margin:
      top: 2.5cm
      bottom: 2.5cm
  epub:
    # Los .qmd llevan la marca GUÍA-DE-LECTURA como comentario HTML, para el
    # editor. Typst los descarta solos; el EPUB los arrastraría al entregable.
    strip-comments: true
    toc: true
    epub-cover-image: cover/frente.png
    include-in-header: _extensions/orange-book-es/epub-estilos.html
