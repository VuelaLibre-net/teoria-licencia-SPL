# Mazo Anki de 04-comunicaciones, capítulo 6.
#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 04-comunicaciones
capitulo: 6
titulo: "Procedimientos de socorro (*distress*) y urgencia (*urgency*)"
tarjetas:
  - id: cuando-mayday
    tipo: basica
    anverso: ¿Cuándo se declara **MAYDAY** (×3) y qué efecto tiene?
    reverso: |
      **Ante peligro grave e inminente con riesgo vital** (fuego, colisión,
      fallo estructural).

      Da prioridad absoluta e impone **silencio total de radio** al resto.

  - id: cuando-pan-pan
    tipo: basica
    anverso: ¿Cuándo se usa **PAN PAN** (×3)?
    reverso: |
      **Ante una urgencia que pide asistencia prioritaria pero sin riesgo
      inmediato de accidente**: enfermo a bordo, desorientación, avería no
      crítica.

      Pide prioridad, no silencio.

  - id: silencio-ante-mayday-ajeno
    tipo: basica
    anverso: ¿Qué puede transmitirse en una frecuencia con un **Mayday** declarado?
    reverso: |
      **Sólo ayuda directa a la aeronave en peligro, o la retransmisión de su
      mensaje (*Mayday relay*).**
    etiquetas: [Normativa]

  - id: estructura-mensaje-emergencia
    tipo: basica
    anverso: Estructura del mensaje de socorro o urgencia.
    reverso: |
      **A QUIÉN** (estación) + **QUIÉN** (indicativo) + **DÓNDE** (posición) +
      **QUÉ PASA** (problema) + **QUÉ SOLICITA** (intenciones y asistencia).

  - id: frecuencia-de-emergencia
    tipo: basica
    anverso: ¿En qué frecuencia se declara la emergencia?
    reverso: |
      **En aquella en la que ya estés establecido.** Si falla o no responden,
      pasa a la internacional de emergencia **121,500 MHz**.

  - id: senales-de-interceptacion
    tipo: cloze
    texto: |
      Señales del **interceptor**: alabeando por delante y a tu izquierda =
      {{c1::«Sígame»}}; viraje ascendente brusco de 90º o más =
      {{c2::«Prosiga»}}; tren desplegado y faros encendidos sobre la pista =
      {{c3::«Aterrice en este aeródromo»}}.
    extra: |
      Se responde alabeando y siguiéndole. A bordo debe llevarse copia de las
      señales.

      *Fundamento: SERA.11015; obligación de llevarlas a bordo, SAO.GEN.155.*

  - id: procedimiento-de-interceptacion
    tipo: basica
    anverso: Procedimiento completo ante una **interceptación**.
    reverso: |
      **Seguir las instrucciones visuales + notificar al ATS + llamada en
      121,500 MHz + squawk 7700.**

  - id: prevalencia-del-interceptor
    tipo: basica
    anverso: Si el ATC te dice una cosa y el interceptor otra, ¿a quién obedeces?
    reverso: |
      **Al interceptor**, mientras solicitas aclaración inmediata
      (**SERA.11015 c) y d)**).

      Mantén trayectoria suave y predecible, sin maniobras bruscas, y responde a
      cada señal.
    etiquetas: [Seguridad]

  - id: senalizacion-de-un-velero
    tipo: basica
    anverso: ¿Cómo responde visualmente un velero sin luces de navegación?
    reverso: |
      **Con alabeo amplio y claro**, compensando con radio (121,500 MHz) y
      transpondedor (7700).

      La mejor interceptación es la que no ocurre: comprueba NOTAM y zonas P y R
      antes de cada travesía.
    etiquetas: [Airmanship]


# ==========================================================================
# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
# ==========================================================================
#
# POST-IT (5 viñetas)
#  [1]
#     **MAYDAY (x3)**: Exclusivo para situaciones de peligro **GRAVE E INMINENTE** con riesgo
#     vital (fuego, colisión, fallo estructural). Otorga prioridad absoluta e impone silencio
#     total de radio al resto de tráficos.
#  [2]
#     **PAN PAN (x3)**: Situación de **URGENCIA**. Requiere asistencia prioritaria (enfermo a
#     bordo, desorientación, avería no crítica) pero no existe riesgo inmediato de accidente. Pide
#     prioridad, no silencio total.
#  [3]
#     **Estructura del mensaje**: A QUIÉN (Estación) + QUIÉN (Indicativo) + DÓNDE (Posición) + QUÉ
#     PASA (Problema) + QUÉ SOLICITA (Intenciones y asistencia).
#  [4]
#     **Frecuencia recomendada**: La mejor frecuencia es aquella donde el vuelo ya está
#     establecido en contacto. Si falla o no hay respuesta, pasar a la frecuencia internacional de
#     emergencia 121.500 MHz.
#  [5]
#     **Interceptación (SERA.11015)**: interceptor alabeando por delante y a tu izquierda =
#     «Sígame» (responde alabeando y siguiéndole); viraje ascendente brusco de 90° o más =
#     «Prosiga»; tren desplegado y faros encendidos sobre la pista = «Aterrice en este aeródromo».
#     Procedimiento: seguir las instrucciones visuales + notificar al ATS + llamada en 121,500 MHz
#     + squawk 7700. **Las instrucciones del interceptor prevalecen sobre cualquier otra fuente,
#     incluido el ATC**, mientras se solicita aclaración. A bordo debe llevarse copia de las
#     señales (SAO.GEN.155).
#
# RECUADROS (5)
#  [Seguridad 1]
#     La transmisión maliciosa o falsa de un mensaje de socorro MAYDAY moviliza recursos de
#     búsqueda y salvamento (SAR) estatales. Según la Ley de Seguridad Aérea, simular emergencias
#     o proporcionar información falsa que comprometa la seguridad se tipifica como infracción muy
#     grave, conlleva sanciones económicas elevadas y puede resultar en la revocación de la
#     licencia de vuelo.
#  [Normativa 2]
#     La declaración de un MAYDAY impone, según la normativa internacional (OACI/EASA), un
#     **silencio de radio absoluto** para todas las demás estaciones áreas y terrestres operando
#     en esa frecuencia. Ningún otro tráfico debe transmitir a menos que sea para ofrecer ayuda
#     directa a la aeronave en peligro o para retransmitir su mensaje a la Torre de Control
#     (**Mayday relay**).
#  [Normativa 3]
#     SERA.11015 c): «Si alguna instrucción recibida por radio de cualquier fuente estuviera en
#     conflicto con las instrucciones dadas por la aeronave interceptora mediante señales
#     visuales, la aeronave interceptada requerirá aclaración inmediatamente mientras continúa
#     cumpliendo con las instrucciones visuales dadas por la aeronave interceptora.» La misma
#     regla se aplica si el conflicto es con instrucciones dadas por radio por el interceptor
#     (SERA.11015 d)).
#  [Seguridad 4]
#     **Las instrucciones del interceptor prevalecen sobre cualquier otra fuente, incluido el
#     ATC**, mientras solicitas aclaración —en la duda, obedece al que lleva misiles—. Un
#     interceptor armado que cree que no cooperas es el escenario más peligroso en el que puede
#     meterse una aeronave civil: mantén una trayectoria suave y predecible, no hagas maniobras
#     bruscas y responde a cada señal.
#  [Airmanship 5]
#     Un velero sin luces de navegación tiene pocas opciones de señalización: tu respuesta visible
#     es el **alabeo amplio y claro**. Compensa el resto con la radio (121,500 MHz) y el
#     transpondedor (7700). Y recuerda que la mejor interceptación es la que no ocurre: comprueba
#     los NOTAM y el estado de las zonas P y R antes de cada vuelo de travesía.
