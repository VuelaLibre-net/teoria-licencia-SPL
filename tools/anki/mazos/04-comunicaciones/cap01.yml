# Mazo Anki de 04-comunicaciones, capítulo 1.
#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 04-comunicaciones
capitulo: 1
titulo: "Definiciones"
tarjetas:
  - id: banda-vhf-aeronautica
    tipo: basica
    anverso: ¿Qué banda usa la voz aeronáutica y con qué espaciado de canal en Europa?
    reverso: |
      **VHF, 118-136,975 MHz, con espaciado de 8,33 kHz** (Reglamento UE
      1079/2012).

      La norma internacional de referencia es el **Anexo 10 de la OACI**
      (volumen II).
    etiquetas: [Normativa]

  - id: estacion-aeronautica-vs-de-aeronave
    tipo: basica
    anverso: ¿Cómo se llaman las dos estaciones de un enlace aeronáutico?
    reverso: |
      **La de tierra es la «estación aeronáutica»; el piloto opera desde la
      «estación de aeronave».**

  - id: que-se-colaciona
    tipo: basica
    anverso: ¿Qué es obligatorio **colacionar**?
    reverso: |
      Autorizaciones, rumbos y altitudes, pista en uso, **QNH**, cambios de
      frecuencia, transferencias ATC y el código de transpondedor asignado.

  - id: recibido-no-sustituye-colacion
    tipo: basica
    anverso: ¿Vale «Recibido» o «Wilco» como respuesta a una autorización?
    reverso: |
      **No.** Hay que recitar los parámetros tal como los han dado.

      «Recibido» nunca sustituye a una colación obligatoria, y «Afirmativo» se
      evita siempre (se dice **Afirma**).
    etiquetas: [Regla de oro]

  - id: colacion-y-runway-incursion
    tipo: basica
    anverso: ¿Por qué es crítica la colación de una autorización de despegue o aterrizaje?
    reverso: |
      **Porque su omisión es una de las causas más frecuentes de incursión en
      pista.**

      Si el controlador no oye la colación correcta, puede autorizar a otra
      aeronave en la misma pista. Ante la duda, pide confirmación **antes** de
      ejecutar.
    etiquetas: [Seguridad]

  - id: conservacion-de-grabaciones
    tipo: basica
    anverso: ¿Cuánto se conservan las comunicaciones grabadas?
    reverso: |
      **Un mínimo de 30 días**, e indefinidamente si son relevantes para una
      investigación o reclamación.
    etiquetas: [Normativa]

  - id: disciplina-de-radio
    tipo: basica
    anverso: ¿Cuál es la secuencia de **disciplina de radio**?
    reverso: |
      **Piensa → Escucha → Pulsa y cuenta uno → Habla.**

      Menos de 100 palabras por minuto, con el mensaje preparado antes de pulsar
      el PTT: quién llama, a quién, qué necesita.
    etiquetas: [Regla de oro]

  - id: transmision-de-numeros
    tipo: basica
    anverso: ¿Cómo se transmiten los **números** por radio?
    reverso: |
      **Dígito a dígito** («tres cuatro», nunca «treinta y cuatro»), salvo
      centenas y miles exactos, que van como unidades («dos mil seiscientos»).

  - id: transmision-de-frecuencias
    tipo: basica
    anverso: ¿Cómo se dicen las **frecuencias**, y qué se hace antes de cambiar?
    reverso: |
      **Con «coma»: «uno dos cuatro coma cuatro cero».**

      Y **colaciona siempre el nuevo canal completo** antes de abandonar la
      frecuencia.
    etiquetas: [Regla de oro]

  - id: matricula-abreviada
    tipo: basica
    anverso: ¿Cuándo se puede abreviar la **matrícula**?
    reverso: |
      **Sólo cuando la torre la haya usado abreviada primero.**

      El primer contacto va siempre con la matrícula completa en fonético.

  - id: escala-de-legibilidad
    tipo: basica
    anverso: ¿Qué escala se usa para la calidad de señal, y cuánto dura una prueba de radio?
    reverso: |
      **Del 1 (ilegible) al 5 (perfectamente legible)**, y la prueba no debe
      pasar de **10 segundos**.

      Si no responden, espera al menos 10 segundos antes de reintentar.
    etiquetas: [Airmanship]

  - id: niner
    tipo: basica
    anverso: ¿Por qué el 9 se pronuncia **«niner»** en frecuencias internacionales?
    reverso: |
      **Para no confundirlo con «nein» (no, en alemán).**
    etiquetas: [Airmanship]


# ==========================================================================
# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
# ==========================================================================
#
# POST-IT (6 viñetas)
#  [1]
#     **Introducción**: Las comunicaciones aeronáuticas de voz se realizan en VHF (118–136,975
#     MHz), reguladas por el Anexo 10 de la OACI. El espaciado de canales en Europa es de 8,33 kHz
#     (Reglamento UE 1079/2012). La estación en tierra es la «estación aeronáutica»; el piloto
#     opera desde la «estación de aeronave».
#  [2]
#     **La colación (readback)**: Repetir textualmente las instrucciones del ATC es obligatorio
#     para: autorizaciones, rumbos/altitudes, pista en uso, QNH, cambios de frecuencia,
#     transferencias ATC y código de transpondedor cuando sea asignado.
#  [3]
#     **Fraseología estándar**: La radio no admite lenguaje coloquial. Términos clave: **Afirma**,
#     **Negativo**, **Wilco**, **Solicito**, **Recibido**. «Recibido» nunca sustituye a una
#     colación obligatoria, y «Afirmativo» se evita siempre.
#  [4]
#     **Disciplina de radio**: Piensa → Escucha → Pulsa y cuenta uno → Habla. Menos de 100
#     palabras por minuto, mensaje preparado antes de pulsar el PTT.
#  [5]
#     **Transmisión de números, horas y frecuencias**: Números dígito a dígito («*tres cuatro*»,
#     nunca «treinta y cuatro»); centenas y miles exactos como unidades («*dos mil seiscientos*»).
#     Horas en UTC, normalmente solo los minutos. Frecuencias con «coma»: «*uno dos cuatro coma
#     cuatro cero*». Colaciona siempre el nuevo canal antes de cambiar.
#  [6]
#     **Identificación**: La matrícula es el nombre de la aeronave. Primer contacto: matrícula
#     completa en fonético. Matrícula abreviada: solo cuando la torre la use primero.
#
# RECUADROS (7)
#  [Normativa 1]
#     El **Anexo 10 de la OACI** (Volumen II, Comunicaciones) es la norma de referencia
#     internacional para las telecomunicaciones aeronáuticas. El equipo de radio debe estar
#     homologado y calibrado según sus especificaciones antes de cualquier vuelo en espacio aéreo
#     controlado.
#  [Normativa 2]
#     La obligación de colacionar autorizaciones e instrucciones críticas está establecida en el
#     Anexo 10 al Convenio sobre Aviación Civil Internacional de la OACI. Las comunicaciones
#     grabadas se conservan un mínimo de 30 días, y pueden retenerse indefinidamente si son
#     relevantes para una investigación o reclamación. Una colación incorrecta o ausente
#     constituye una desviación de los procedimientos estándar y puede dar lugar a incidente o
#     accidente.
#  [Seguridad 3]
#     La omisión de la colación de una autorización de despegue o aterrizaje es una de las causas
#     más frecuentes de incursiones en pista (**runway incursions**). Si el controlador no escucha
#     la colación correcta, puede autorizar simultáneamente a otra aeronave a operar en la misma
#     pista. Ante cualquier duda sobre una instrucción recibida, solicite confirmación inmediata
#     antes de ejecutarla.
#  [Regla de oro 4]
#     La frecuencia de radio es un recurso compartido. Un mensaje breve, preciso y sin
#     vacilaciones libera la frecuencia para otros tráficos y para emergencias. Planifique el
#     mensaje antes de pulsar el PTT: quién llama, a quién, qué necesita.
#  [Regla de oro 5]
#     Antes de abandonar una frecuencia, colaciona siempre el nuevo valor completo. Así ambas
#     partes confirman que el piloto ha comprendido el canal correcto antes de cambiar de dial.
#  [Airmanship 6]
#     Para verificar la calidad de la señal de radio, utilice la escala normalizada del 1
#     (ilegible) al 5 (perfectamente legible). La prueba de radio no debe superar los 10 segundos.
#     Si no obtiene respuesta tras la primera llamada a una torre, espere un mínimo de 10 segundos
#     antes de reintentar, para no interferir con otras gestiones del controlador.
#  [Airmanship 7]
#     (*) En frecuencias internacionales, el dígito 9 se pronuncia **«Niner»** para evitar
#     confusiones con «Nein» (no, en alemán). El alfabeto fonético OACI está diseñado para ser
#     reconocible en cualquier idioma y en condiciones de radio degradadas. Memorícelo hasta que
#     el deletreo sea automático.
