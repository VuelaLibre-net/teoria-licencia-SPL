#
# POST-IT (3 viñetas)
#  [1]
#     Establece el régimen de infracciones y sanciones: las **muy graves** (muerte o accidente)
#     pueden acarrear la inhabilitación.
#  [2]
#     **DGAC**: define la política aeronáutica (las "reglas del juego").
#  [3]
#     **AESA**: vigila y sanciona (el "árbitro").
#
# RECUADROS (3)
#  [Airmanship 1]
#     Podríamos decir que la **DGAC** escribe las "reglas del juego" (política y estrategia) y
#     **AESA** es el "árbitro" que asegura que se cumplan en el día a día (supervisión y sanción).
#  [Seguridad 2]
#     Las sanciones económicas pueden ser **muy elevadas**, incluso para pilotos privados. Volar
#     sin licencia, sin seguro, o bajo los efectos del alcohol puede costarte miles de euros y la
#     inhabilitación para volar. El desconocimiento de la ley **NO** te exime de su cumplimiento.
#  [Regla de oro 3]
#     Ante cualquier duda sobre la legalidad de una operación (ej: volar cerca de un aeropuerto
#     controlado, llevar pasajeros sin recencia), **pregunta antes a tu club, instructor o a
#     AESA**. Es mejor preguntar que enfrentarse a un expediente sancionador.
