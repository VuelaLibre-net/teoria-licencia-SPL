#  [3]
#     **Alturas mínimas (SERA.5005 f)**: 150 m en general, 300 m sobre zonas pobladas. En España,
#     el Real Decreto 552/2014 exceptúa de los 150 m a los planeadores en ladera, siempre que no
#     entrañen riesgo ni molestias a personas o bienes, y permite bajar hasta 50 m entrenando
#     aterrizajes forzosos, a 150 m de cualquier persona, vehículo o embarcación y de todo
#     obstáculo artificial.
#
# RECUADROS (2)
#  [Seguridad 1]
#     La mayoría de colisiones ocurren en días claros y cerca de los aeródromos. Nunca asumas que
#     el otro te ha visto. Si tienes dudas, cede el paso.
#  [Regla de oro 2]
#     **Globo > Planeador > Motor.** Si tiene motor, te cede el paso. Si es un globo, tú cedes. Si
