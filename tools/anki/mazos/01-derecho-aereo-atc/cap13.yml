libro: 01-derecho-aereo-atc
capitulo: 13
titulo: "Notificación de accidentes"
tarjetas:
  - id: definicion-de-accidente
    tipo: basica
    anverso: ¿Qué es un **accidente**?
    reverso: |
      **Lesiones mortales o graves, daños estructurales al avión, o desaparición
      o inaccesibilidad de la aeronave.**

  - id: incidente-grave
    tipo: basica
    anverso: ¿Qué es un **incidente grave**?
    reverso: |
      **Aquel cuyas circunstancias indican alta probabilidad de accidente**, o
      que puso —o pudo poner— en peligro la seguridad de la operación.

  - id: plazos-de-notificacion
    tipo: basica
    anverso: ¿A quién y en qué plazo se notifica un accidente?
    reverso: |
      **Sin demora a la autoridad de investigación de accidentes** (la antigua
      CIAIAC), y **a AESA en un máximo de 72 horas.**
    etiquetas: [Normativa]

  - id: sucesos-de-notificacion-obligatoria
    tipo: basica
    anverso: Además de accidentes e incidentes graves, ¿qué sucesos debe notificar obligatoriamente un piloto de planeador?
    reverso: |
      **Los de la lista del Reglamento 2015/1018** (anexo V, sección 2). Por
      ejemplo: una violación de espacio aéreo, una cuasicolisión que exija
      maniobra evasiva, una suelta del cable que haya puesto en peligro el
      planeador, una llamada de emergencia o quedarte sin ninguna zona de
      aterrizaje segura.

      *Fundamento: Reglamento (UE) 376/2014, art. 4; Reglamento de Ejecución
      (UE) 2015/1018, anexo V.*
    etiquetas: [Normativa]

  - id: preservar-los-restos
    tipo: basica
    anverso: Tras un accidente, ¿qué orden de prioridades hay?
    reverso: |
      1. **Salvar vidas** y evitar más peligros (fuego).
      2. **No tocar nada.**

      Preservar los restos es vital para la investigación técnica. Sólo
      muévelos si es imprescindible para sacar víctimas o evitar un incendio.
    etiquetas: [Seguridad]

  - id: cultura-justa-notificacion
    tipo: basica
    anverso: ¿Para qué sirve notificar, según la **cultura justa**?
    reverso: |
      **Para aprender, no para buscar culpables** —salvo negligencia grave o
      dolo—.

      No tengas miedo a reportar tus errores: es la única forma de que el
      sistema mejore.
    etiquetas: [Regla de oro]


# ==========================================================================
# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
# ==========================================================================
#
# POST-IT (4 viñetas)
#  [1]
#     **Accidente**: hay lesiones mortales o graves, daños estructurales al avión, o la aeronave
#     desaparece o queda inaccesible.
#  [2]
#     **Incidente grave**: las circunstancias indican que hubo alta probabilidad de accidente, o
#     el suceso puso (o pudo poner) en peligro la seguridad de la operación.
#  [3]
#     **Obligación**: comunicarlo **sin demora** a la **CIAIAC**; notificar el suceso a **AESA**
#     en un plazo máximo de **72 horas**.
#  [4]
#     **Pruebas**: no toques nada, salvo para salvar vidas o evitar otro peligro. Preservar los
#     restos es vital para la investigación.
#
# RECUADROS (2)
#  [Regla de oro 1]
#     La normativa europea promueve la "Cultura Justa". El objetivo de notificar **NO es buscar
#     culpables** (salvo negligencia grave o dolo), sino **aprender**. No tengas miedo a reportar
#     tus errores; es la única forma de que el sistema mejore.
#  [Seguridad 2]
#     Si sufres o presencias un accidente: 1. Prioridad: **Salvar vidas** y evitar más peligros
#     (fuego, etc.). 2. Después: **NO TOQUES NADA**. Preservar los restos es vital para la
#     investigación de la CIAIAC. Solo muévelos si es imprescindible para sacar a víctimas o
#     evitar un incendio.
