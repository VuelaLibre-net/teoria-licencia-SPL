#
# POST-IT (6 viñetas)
#  [1]
#     **Referencias Visuales**: Usa objetos grandes, lineales y con contraste (ríos, autopistas,
#     líneas de costa). Oriente la carta siempre en el sentido del vuelo (lo que ves a la derecha
#     en el suelo, a la derecha en el papel). Fija la posición cada 10-15 minutos.
#  [2]
#     **Cono de alcance**: $D = h \cdot (L/D)$, corregido por viento con el factor $GS/TAS$.
#     Descuenta primero el margen de llegada de la altura. Planifica con fineza degradada: el aire
#     entre térmicas desciende y se suma a tu descenso.
#  [3]
#     **Triangulación**: No te fíes de una sola referencia. Cruza al menos dos "líneas de
#     posición" (ej. el cruce de una carretera y el eje de una montaña) para saber dónde estás con
#     certeza. Cuanto más perpendiculares se corten, mejor.
#  [4]
#     **Error deliberado**: para encontrar un punto pequeño, apunta a propósito a un lado hacia
#     una referencia lineal. Al llegar sabes con certeza hacia dónde girar.
#  [5]
#     **Incertidumbre de Posición**: Si te pierdes, NO SIGAS VOLANDO A CIEGAS. Mantén el rumbo,
#     busca referencias grandes, confía en tu estima inicial y, si es necesario, vuela hacia un
#     lugar conocido (un río, una costa) o aterriza con seguridad antes de quedarte sin altura.
#  [6]
#     **Desvío**: se decide con altura y con tres datos —dónde estás, qué alcanzas y qué hay
#     dentro de ese alcance—. Es la planificación del capítulo 4 hecha sobre las rodillas.
#
# RECUADROS (7)
#  [Regla de oro 1]
#     Elige puntos de comprobación que sean **inconfundibles y estén en tu ruta**: un cruce de
#     autovía con río, un embalse de forma reconocible, un pueblo con silo. Un pueblo cualquiera
#     en una meseta con veinte pueblos iguales no es un punto de comprobación: es una trampa.
#  [Seguridad 2]
#     La fineza del manual se mide en aire en calma y en vuelo rectilíneo estabilizado. El aire
#     real entre térmicas **desciende**, y ese descenso se suma al tuyo. Planifica siempre con una
#     fineza degradada —muchos pilotos usan la mitad de la nominal— y **llega con altura
#     sobrante**: 300 m sobre el campo es un mínimo razonable para tener tiempo de organizar el
#     circuito.
#  [Airmanship 3]
#     Este cálculo es el que hacen en continuo los ordenadores de planeo, y lo hacen mejor:
#     conocen la polar del planeador, el viento medido y la altitud del campo. Lo que no conocen
#     es el aire que vas a encontrar en los próximos veinte kilómetros. La flecha verde de la
#     pantalla es una hipótesis, no una promesa.
#  [Regla de oro 4]
#     El error deliberado cambia **una duda por un rodeo**. Es un buen trato casi siempre, y sobre
#     todo cuando el punto que buscas es un aeródromo pequeño, el terreno es monótono y te queda
#     poca altura para exploraciones.
#  [Seguridad 5]
#     Si la incertidumbre persiste y tu altura se reduce, deja de intentar navegar y concéntrate
#     en aterrizar. **Navegar es secundario; volar el planeador y asegurar una toma segura es lo
#     primero.**
#  [Airmanship 6]
#     Si tienes radio y estás en contacto con un servicio ATC, no dudes en preguntar: "Madrid,
#     EC-XYZ, dudo de mi posición, solicito vector o confirmación". No hay vergüenza en pedir
#     ayuda antes de que la situación sea crítica.
#  [Seguridad 7]
#     Decide el desvío **con altura**, no cuando ya no te quede otra. Una decisión tomada a 1.500
#     m tiene varias soluciones buenas; la misma decisión a 400 m tiene una sola, y no la eliges
#     tú.
