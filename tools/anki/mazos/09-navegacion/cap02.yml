# Mazo Anki de 09-navegacion, capítulo 2.
#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 09-navegacion
capitulo: 2
titulo: "Magnetismo y brújulas"
tarjetas:
  - id: variacion-definicion
    tipo: basica
    anverso: ¿Qué es la **variación** (o declinación) magnética?
    reverso: |
      **La diferencia angular entre el norte geográfico (verdadero) y el norte
      magnético,** que es al que apunta la brújula.

  - id: declinacion-oeste-rumbo-suma
    tipo: basica
    anverso: ¿Cómo se aplica la variación al pasar de rumbo verdadero a magnético?
    reverso: |
      **«Declinación Oeste, Rumbo Suma».**

      Con variación al oeste, el rumbo magnético es mayor que el verdadero.
    etiquetas: [Regla de oro]

  - id: coste-de-ignorar-variacion
    tipo: basica
    anverso: ¿Cuánto te desvía ignorar **2º de variación** en un tramo de 100 km?
    reverso: |
      **3,5 km fuera de ruta.**

      Da igual para un aeródromo grande; no da igual para el campo concreto con
      el que contabas, ni si te acerca al borde de un espacio restringido.
    etiquetas: [Seguridad]

  - id: desvio-definicion
    tipo: basica
    anverso: ¿Qué es el **desvío** de la brújula y de qué depende?
    reverso: |
      **El error que introducen los campos magnéticos de la propia aeronave**
      (tubos de acero, radios).

      Es específico de *esa* aeronave y se corrige con la tablilla de desvíos de
      su cabina, que se lee «para volar X, pon Y».

  - id: tablilla-desvios-sana
    tipo: basica
    anverso: ¿Cómo se reconoce una **tablilla de desvíos** sospechosa?
    reverso: |
      **Por saltos bruscos entre filas contiguas o desvíos de más de 10º.**

      Una tablilla sana varía poco y suavemente —del orden de +3º a −3º,
      describiendo una curva—, porque el campo que la produce es el mismo y sólo
      cambia su orientación. Un salto es aviso de tablilla mal copiada, caducada
      o de hierro nuevo en la cabina.
    etiquetas: [Airmanship]

  - id: cuando-dice-la-verdad-la-brujula
    tipo: basica
    anverso: ¿En qué condiciones es fiable la indicación de la **brújula**?
    reverso: |
      **Sólo en vuelo recto, nivelado y no acelerado.**

      «La brújula sólo dice la verdad cuando no la molestas»: alas niveladas,
      velocidad constante y unos segundos de calma. En cualquier otro momento
      está reaccionando a la maniobra, no al norte magnético.
    etiquetas: [Regla de oro]

  - id: origen-errores-dinamicos
    tipo: basica
    anverso: ¿De dónde salen los **errores dinámicos** de la brújula?
    reverso: |
      **Del contrapeso de la rosa.**

      Cuelga bajo su suspensión para contrarrestar la inclinación del campo
      terrestre, y ese peso reacciona a cualquier aceleración: de ahí nacen el
      error de viraje y el de aceleración.

  - id: error-de-viraje
    tipo: basica
    anverso: ¿Qué hace la brújula al **virar** hacia el norte y hacia el sur?
    reverso: |
      **Al norte se queda atrás; al sur se adelanta.**

      Mnemotécnico **NO me paso / SÍ me paso**: virando al norte, para antes de
      que la brújula llegue a 360; virando al sur, déjala pasar de 180 antes de
      nivelar.
    etiquetas: [Airmanship]

  - id: magnitud-error-viraje
    tipo: basica
    anverso: ¿De qué orden es la **magnitud del error de viraje**?
    reverso: "**De la latitud del lugar: unos 40º en España.**"

  - id: error-aceleracion-ands
    tipo: basica
    anverso: ¿Qué marca la brújula al acelerar o frenar en rumbos **este u oeste**?
    reverso: |
      **Al acelerar, viraje aparente al norte; al frenar, al sur.**

      Mnemotécnico **ANDS**: *Accelerate North, Decelerate South*.

