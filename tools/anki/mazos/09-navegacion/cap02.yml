# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
# ==========================================================================
#
# POST-IT (5 viñetas)
#  [1]
#     **Norte Verdadero vs Magnético**: La brújula apunta al Norte Magnético, que no coincide con
#     el Geográfico (Verdadero). La diferencia es la **Variación (o Declinación)**. Regla:
#     "Declinación Oeste, Rumbo Suma".
#  [2]
#     **Desvío**: El propio avión tiene campos magnéticos (tubos de acero, radios) que afectan a
#     la brújula. Este error es el **Desvío** y se corrige con la tablilla de desvíos de la
#     cabina, que se lee «para volar X, pon Y» y es específica de esa aeronave.
#  [3]
#     **Errores de la Brújula**: La brújula solo dice la verdad en vuelo recto y nivelado (y no
#     acelerado). Los dos errores dinámicos salen de lo mismo: el peso de la rosa cuelga bajo su
#     suspensión para contrarrestar la inclinación del campo, y ese peso reacciona a cualquier
#     aceleración.
#  [4]
#     **Error de Viraje**: Al virar al Norte, la brújula se queda atrás (vas corto: NO te pases);
#     al Sur se adelanta (déjala pasar: SÍ te pasas). La magnitud es del orden de la **latitud del
#     lugar**: unos 40º en España.
#  [5]
#     **Error de Aceleración**: Al acelerar en rumbos E/W, marca viraje al Norte; al frenar, al
#     Sur (regla **ANDS**: **Accelerate North, Decelerate South**).
#
# RECUADROS (5)
#  [Regla de oro 1]
#     Para los cálculos, recuerda esta rima: **"Declinación Oeste, Rumbo Suma"** (si la variación
#     es hacia el oeste, el rumbo magnético será mayor que el verdadero).
#  [Seguridad 2]
#     Ignorar 2º de variación en un tramo de 100 km te deja **3,5 km** fuera de ruta. Da igual si
#     buscas un aeródromo grande; no da igual si lo que buscas es un campo concreto con el que ya
#     contabas, o si te acerca al borde de un espacio aéreo restringido.
#  [Airmanship 3]
#     Los desvíos de una tablilla sana varían **poco y suavemente** de un rumbo al siguiente: aquí
#     van de +3º a −3º describiendo una curva, porque el campo que los produce es el mismo y sólo
#     cambia su orientación respecto a la brújula. Un salto brusco entre dos filas contiguas, o
#     desvíos de más de 10º, no son un dato: son un aviso de que la tablilla está mal copiada,
#     caducada o de que alguien ha metido hierro en la cabina desde que se levantó.
#  [Airmanship 4]
#     Usa el mnemotécnico **NO me paso / Si me paso**: Al virar hacia el **Norte**, detén el
#     viraje antes de que la brújula llegue al 360 (**NO** llegues). Al virar hacia el **Sur**,
#     deja que la brújula pase del 180 antes de nivelar (**SI** pásate).
#  [Regla de oro 5]
#     Los dos errores se resumen en una frase: **la brújula sólo dice la verdad cuando no la
#     molestas**. Vuelo recto, alas niveladas, velocidad constante y unos segundos de calma. En
#     cualquier otro momento es un instrumento que está reaccionando a la maniobra, no al norte
#     magnético.
