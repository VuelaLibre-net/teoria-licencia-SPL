# Anki deck for en/02-human-performance, chapter 4.
#
# Canonical source, edited by hand. Translated from
# tools/anki/mazos/02-factores-humanos/cap04.yml, with the same ids:
# an id is the card's identity in the student's collection, do NOT rename it.
libro: en/02-human-performance
capitulo: 4
titulo: "Use of oxygen"
tarjetas:
  - id: ley-de-dalton
    tipo: basica
    anverso: What does **Dalton's law** explain about hypoxia?
    reverso: |
      **That the partial pressure of each gas is its share of the total
      pressure:** oxygen is always 21 %, so as atmospheric pressure falls with
      altitude, its partial pressure falls too and oxygen passes into the blood
      less easily.

  - id: ley-de-boyle
    tipo: basica
    anverso: What does **Boyle's law** explain in flight?
    reverso: |
      **That body gases expand as you climb and contract as you descend.**

      Hence barotrauma of the ears and sinuses if you fly with a blocked nose,
      especially in the descent.
    etiquetas: [Airmanship]

  - id: mecanismo-de-la-hipoxia
    tipo: basica
    anverso: What happens in the body when **hypoxia** sets in?
    reverso: |
      **The lower partial pressure of oxygen loads less onto the haemoglobin,
      and the brain gets less oxygen than it needs.**

      It is gradual: saturation is about 89 % at 10,000 ft and 65 % at
      20,000 ft.

  - id: cuatro-clases-de-hipoxia
    tipo: cloze
    texto: |
      Types of hypoxia: {{c1::hypoxic}} (low atmospheric pressure, the most
      frequent in gliders), {{c2::hypaemic}} (carbon monoxide, smoking),
      {{c3::stagnant}} (G-forces in tight turns) and {{c4::histotoxic}}
      (alcohol, narcotics or poisons).

  - id: primer-sintoma-hipoxia
    tipo: basica
    anverso: Which early symptom of hypoxia is the most treacherous, and why?
    reverso: |
      **Euphoria: the pilot does not see the danger on their own.**

      The order of symptoms varies from person to person. Then come
      drowsiness, difficulty with calculations, cyanosis and loss of
      consciousness.
    etiquetas: [Safety]

  - id: tuc
    tipo: basica
    anverso: What is the **Time of Useful Consciousness** at 25,000 and at 30,000 ft?
    reverso: |
      **3 to 5 minutes at 25,000 ft; 1 to 2 minutes at 30,000 ft.**

      These are FAA averages: they vary a great deal from person to person.
      A long descent can take longer than the TUC available: act before you
      need to.

  - id: oxigeno-al-100-y-desciende
    tipo: basica
    anverso: What is the rule for an oxygen failure or suspected hypoxia?
    reverso: |
      **“Oxygen and descend”**: your equipment at maximum supply and down below
      10,000 ft, without hesitation.

      At a certain altitude, the TUC leaves no time to think.
    etiquetas: [Golden rule]

  - id: distinguir-hipoxia-de-hiperventilacion
    tipo: basica
    anverso: What do you do about symptoms that could be **hypoxia** or **hyperventilation**?
    reverso: |
      **Do not diagnose in flight: act in order.**

      1. Hypoxia first: oxygen at maximum supply, check the equipment and, if
         you are high, descend.
      2. If it does not improve, treat hyperventilation: slow your breathing.

      The symptoms are alike, and hypoxia also occurs below 10,000 ft (CO,
      night, smoking).
    etiquetas: [Golden rule]

  - id: no-dar-oxigeno-en-hiperventilacion
    tipo: basica
    anverso: If you suspect **hyperventilation** but cannot rule out hypoxia, do you use oxygen?
    reverso: |
      **Yes: if in doubt, treat hypoxia first.** Turn the oxygen on or up, check
      the equipment and then control your breathing rate.

      Oxygen does not make hyperventilation worse, and the two can occur
      together.

      *Source: ICAO, Doc 8984; FAA, AIM 8-1-3.*
    etiquetas: [Safety]

  - id: hiperventilacion-causa
    tipo: basica
    anverso: What causes **hyperventilation**, and what are its symptoms?
    reverso: |
      **Mainly stress or anxiety**, although it can also come with hypoxia.

      Breathing out too much CO₂ constricts the blood vessels in the brain:
      tingling, cramps and dizziness, very similar to hypoxia.

  - id: sao-op-150-oxigeno
    tipo: basica
    anverso: What do the EU sailplane operating rules require about oxygen, and what default rule does their acceptable means of compliance give?
    reverso: |
      **The regulation: use it when the pilot-in-command determines that a lack
      of it may impair the occupants' faculties.** It sets no figure.

      AMC1, an acceptable means of compliance, says that if they cannot
      determine this, oxygen **should** be used above **10,000 ft** pressure
      altitude.

      *Source: Part-SAO, SAO.OP.150, and its AMC1.*
    etiquetas: [Regulation]

  - id: oxigeno-de-noche-5000
    tipo: basica
    anverso: From what altitude is oxygen **recommended** at night or at dusk?
    reverso: |
      **From 5,000 ft**: a recommendation, not a rule.

      The rods in the peripheral retina are the first cells affected by a lack
      of oxygen, so night vision is the first to degrade.
    etiquetas: [Airmanship]

  - id: flujo-continuo-vs-eds
    tipo: basica
    anverso: Compare the **continuous-flow** system with the **pulse-demand (EDS)** system.
    reverso: |
      **Continuous flow**: simple, but uses more oxygen and dries the nasal
      passages. With a cannula, only up to about 18,000 ft; above that, a
      mask. **EDS**: makes the cylinder last much longer, but depends on
      batteries that can fail in the cold.

  - id: oxigeno-de-aviacion
    tipo: basica
    anverso: Why **aviation oxygen** and not medical oxygen?
    reverso: |
      **Because neither medical nor industrial oxygen meets the specifications
      of aviation oxygen: their suitability for flight is not guaranteed.**
    etiquetas: [Safety]

  - id: grasas-y-oxigeno
    tipo: basica
    anverso: Why must creams and grease be kept away from oxygen equipment?
    reverso: |
      **Because oxygen under pressure in contact with greasy substances can
      ignite explosively without any flame or spark.**

      No creams, sunscreen or lubricants on connections, regulators or
      nozzles.
    etiquetas: [Safety]

  - id: presion-de-la-botella
    tipo: basica
    anverso: What do you check on the oxygen cylinder gauge before the flight?
    reverso: |
      **That the pressure is enough for the planned flight with a reserve**,
      given the cylinder's capacity and the manufacturer's endurance table.

      The filling pressure depends on the cylinder, and it drops in the cold.

  - id: pulsioximetro-umbral
    tipo: basica
    anverso: What saturation (SpO₂) should you keep, and what do you do below it?
    reverso: |
      **Above 90 %.** Below that, turn on the oxygen and descend immediately.

      The pulse oximeter helps to detect hypoxia before the symptoms become
      obvious, but it is not a substitute: with carbon monoxide it reads
      normal, and cold or movement distort it. If you have symptoms, act even
      if the reading looks good.
    etiquetas: [Airmanship]

  - id: checklist-de-hipoxia
    tipo: basica
    anverso: Why carry an emergency *checklist* for hypoxia?
    reverso: |
      **Because your reasoning may already be impaired just when you need it
      most.**
    etiquetas: [Airmanship]
