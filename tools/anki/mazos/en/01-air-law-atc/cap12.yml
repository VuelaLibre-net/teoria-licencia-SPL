libro: en/01-air-law-atc
capitulo: 12
titulo: "Security"
tarjetas:
  - id: safety-vs-security
    tipo: basica
    anverso: The difference between **safety** and **security**.
    reverso: |
      **Safety**: operational safety; not having an accident while flying.

      **Security**: physical security; nobody stealing your aircraft or planting
      a bomb.

  - id: deberes-de-security
    tipo: basica
    anverso: What is your part in **security**?
    reverso: |
      **Not leaving the aircraft open or accessible to strangers, not carrying
      dangerous goods** (except for approved exceptions) **and respecting the
      restricted areas of airports.**

  - id: comportamiento-sospechoso
    tipo: basica
    anverso: What should you do if you see someone loitering around the hangars?
    reverso: |
      **Report it immediately** to the person in charge of the airfield or to
      the police.
    etiquetas: [Safety]
