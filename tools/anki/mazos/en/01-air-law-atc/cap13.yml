# Anki deck for en/01-air-law-atc, chapter 13.
#
# Canonical source, edited by hand. Translated from
# tools/anki/mazos/01-derecho-aereo-atc/cap13.yml, with the same ids:
# an id is the card's identity in the student's collection, do NOT rename it.
libro: en/01-air-law-atc
capitulo: 13
titulo: "Accident reporting"
tarjetas:
  - id: definicion-de-accidente
    tipo: basica
    anverso: What is an **accident**?
    reverso: |
      **Fatal or serious injuries, structural damage to the aircraft, or the
      aircraft missing or inaccessible.**

  - id: incidente-grave
    tipo: basica
    anverso: What is a **serious incident**?
    reverso: |
      **An incident in which the circumstances indicate that there was a high
      probability of an accident.**

      *Basis: Regulation (EU) No 996/2010, Article 2(16).*

  - id: plazos-de-notificacion
    tipo: basica
    anverso: To whom, and by when, is an accident reported?
    reverso: |
      **Without delay to the accident investigation authority** (formerly the
      CIAIAC), and **to AESA within 72 hours at most.**
    etiquetas: [Regulation]

  - id: sucesos-de-notificacion-obligatoria
    tipo: basica
    anverso: Apart from accidents and serious incidents, which occurrences must a sailplane pilot report?
    reverso: |
      **Those listed in Regulation 2015/1018** (Annex V, Section 2). For
      example: an airspace infringement, a near collision requiring an
      avoidance manoeuvre, a cable release that endangered the sailplane, an
      emergency call, or being left with no safe landing area.

      *Basis: Regulation (EU) No 376/2014, Article 4; Commission Implementing
      Regulation (EU) 2015/1018, Annex V.*
    etiquetas: [Regulation]

  - id: preservar-los-restos
    tipo: basica
    anverso: After an accident, what is the order of priorities?
    reverso: |
      1. **Save lives** and prevent further danger (fire).
      2. **Do not touch anything.**

      Preserving the wreckage is vital for the technical investigation. Only
      move it for safety reasons or to help the injured, and photograph
      anything before you move it.
    etiquetas: [Safety]

  - id: cultura-justa-notificacion
    tipo: basica
    anverso: What is reporting for, according to **just culture**?
    reverso: |
      **To learn, not to find someone to blame** (except for gross negligence
      or wilful misconduct).

      Do not be afraid to report your mistakes: it is the only way the system
      improves.
    etiquetas: [Golden rule]
