#
# POST-IT (5 viñetas)
#  [1]
#     **Estabilidad estática**: es la tendencia inicial. Si sueltas los mandos tras un bache y el
#     avión tiende a volver a su posición original, es estable. Si tiende a alejarse más
#     (divergencia), es inestable y peligroso.
#  [2]
#     **Estabilidad dinámica**: describe lo que pasa **después** de la reacción inicial. ¿Las
#     oscilaciones se amortiguan (bueno), se mantienen iguales (neutro) o crecen (peligroso)? El
#     modo fugoide es una oscilación longitudinal lenta e inocua. La **tendencia espiral**
#     (divergencia lateral lenta) es la más importante: si sueltas los mandos con un pequeño
#     alabeo, la espiral crece sola.
#  [3]
#     **El CG es el rey**: la posición del centro de gravedad determina la estabilidad
#     longitudinal. CG adelantado = muy estable pero "pesado". CG atrasado = muy sensible e
#     inestable (riesgo de barrena plana irrecuperable).
#  [4]
#     **Estabilidad lateral (diedro)**: la forma en "V" de las alas ayuda a nivelar el avión solo.
#     Si un ala baja, el diedro hace que tenga más ángulo de ataque efectivo y suba.
#  [5]
#     **Estabilidad direccional**: la deriva (cola vertical) actúa como una veleta, manteniendo el
#     morro apuntando al viento relativo y evitando el deslizamiento lateral (*sideslip*), tanto
#     el resbale como el derrape.
#
# RECUADROS (3)
#  [Airmanship 1]
#     Los veleros de escuela suelen diseñarse con una estabilidad estática positiva muy marcada
#     para facilitar el aprendizaje y perdonar errores del alumno. Sin embargo, esto los hace más
#     "pesados" o perezosos de mando. Los veleros de alta competición o acrobacia reducen esta
#     estabilidad para ganar agilidad y respuesta inmediata.
#  [Seguridad 2]
#     La tendencia espiral es el origen de la mayoría de los incidentes por pérdida de control en
#     condiciones de visibilidad reducida. Un planeador abandonado con cinco grados de alabeo
#     puede, en cuestión de minutos, desarrollar una espiral descendente fatal. Nunca vueles sin
#     referencias visuales del horizonte real.
#  [Normativa 3]
#     El Reglamento (UE) 2018/1976, Part-SAO, punto SAO.GEN.130 d)4), establece que el piloto al
#     mando deberá "iniciar un vuelo únicamente tras cerciorarse de que […​] la masa del planeador
#     y la ubicación de su centro de gravedad permiten efectuar el vuelo dentro de los límites
#     definidos por el manual de vuelo de la aeronave (AFM)".
