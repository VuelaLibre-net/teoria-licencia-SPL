# Mazo Anki de 05-principios-vuelo, capítulo 5.
#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 05-principios-vuelo
capitulo: 5
titulo: "Limitaciones (factor de carga y maniobras)"
tarjetas:
  - id: diagrama-v-n
    tipo: basica
    anverso: ¿Qué representa el **diagrama V-n**?
    reverso: |
      **Los G que aguanta la estructura a cada velocidad.**

      Salirse de la caja significa romper el planeador.

  - id: limites-cs22
    tipo: basica
    anverso: Límites de factor de carga de **CS-22** por categoría.
    reverso: |
      **Categoría U**: +5,3 g / −2,65 g en V_A, que se estrechan a +4,0 g /
      −1,5 g en V_D.
      **Categoría A**: +7,0 g / −5,0 g.
    etiquetas: [Normativa]

  - id: velocidad-de-maniobra
    tipo: basica
    anverso: ¿Qué protege la **V_A** (velocidad de maniobra)?
    reverso: |
      **Por debajo de ella, el planeador entra en pérdida antes de romperse**
      ante una deflexión brusca de un mando.

      Por encima, esa misma deflexión puede dañar la estructura.

  - id: va-no-protege-de-entradas-combinadas
    tipo: basica
    anverso: ¿De qué **no** te protege la V_A?
    reverso: |
      **De entradas combinadas simultáneas en más de un eje.**

      La certificación cubre deflexión completa de **un** mando cada vez.
      Profundidad a fondo y pedal a fondo a la vez, aun por debajo de V_A,
      pueden superar el límite de diseño. En turbulencia, mandos suaves.
    etiquetas: [Seguridad]

  - id: marcas-del-anemometro
    tipo: basica
    anverso: ¿Qué marcan los **arcos del anemómetro**?
    reverso: |
      **El arco verde termina en la V_RA** (velocidad máxima en aire
      turbulento), donde empieza el **arco amarillo**, que acaba en la **línea
      roja de la V_NE**.

      El arco amarillo es sólo para aire en calma.

      *Fundamento: CS 22.1545.*
    etiquetas: [Regla de oro]

  - id: va-no-es-marca-del-anemometro
    tipo: basica
    anverso: ¿Está la **V_A** marcada en el anemómetro?
    reverso: |
      **No: es un límite estructural, no una marca.**

      En muchos veleros su valor se parece al de la V_RA, pero no son lo mismo.

  - id: vne-y-flutter
    tipo: basica
    anverso: ¿Qué es la **V_NE** y qué pasa al superarla?
    reverso: |
      **El límite absoluto de velocidad (CS 22.1505), en línea roja.**

      Pasarla invita al **flutter**, una vibración aeroelástica que puede
      desintegrar el planeador en segundos. No es una recomendación.

  - id: vne-y-altitud-05
    tipo: basica
    anverso: ¿Por qué baja la **V_NE indicada** al subir?
    reverso: |
      **Porque el flutter depende de la TAS, y en aire menos denso la TAS crece
      respecto a la IAS que lees.**

      Atiende a la tabla de correcciones de V_NE por altitud de la cabina.
      Crítico en vuelo de onda.
    etiquetas: [Seguridad]

  - id: deflexiones-cerca-de-vne
    tipo: basica
    anverso: ¿Cuánto mando se puede mover cerca de la **V_NE**?
    reverso: |
      **Un tercio del recorrido, aproximadamente.**

      La presión dinámica es tan alta que una deflexión completa puede superar
      la envolvente estructural incluso sin turbulencia. La V_NE no es una
      velocidad de crucero.
    etiquetas: [Airmanship]

  - id: que-hacer-en-turbulencia-fuerte
    tipo: basica
    anverso: ¿Qué se hace al entrar en **turbulencia fuerte**?
    reverso: |
      **Reducir enseguida por debajo de la V_A y quedarse en el arco verde.**
    etiquetas: [Regla de oro]


# ==========================================================================
# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
# ==========================================================================
#
# POST-IT (5 viñetas)
#  [1]
#     **Diagrama V-n**: el mapa de seguridad de tu estructura. Muestra los Gs que aguantas a cada
#     velocidad. Salirte de la "caja" significa romper el planeador. Límites CS-22: cat. U +5,3g /
#     −2,65g en V~A~, que se estrechan a +4,0g / −1,5g en V~D~; cat. A +7,0g / −5,0g.
#  [2]
#     **Velocidad de maniobra (V~A~)**: la velocidad "segura" para turbulencia o mandazos
#     individuales. Si vas más lento de V~A~, el planeador entrará en pérdida antes de romperse.
#     Si vas más rápido, una deflexión brusca puede dañar la estructura. Pero cuidado: la V~A~ no
#     protege de entradas combinadas simultáneas en más de un eje. En turbulencia fuerte, quédate
#     en el arco verde del anemómetro.
#  [3]
#     **Marcas del anemómetro (CS 22.1545)**: el arco verde termina en la **V~RA~** (velocidad
#     máxima en aire turbulento), donde empieza el arco amarillo, que acaba en la línea roja de la
#     V~NE~. La V~A~ es un límite estructural y **no** es una marca del anemómetro, aunque en
#     muchos veleros su valor sea parecido al de la V~RA~.
#  [4]
#     **V~NE~ (velocidad de nunca exceder)**: el límite absoluto de velocidad (CS 22.1505),
#     marcado con la **línea roja** del anemómetro. No es una recomendación, es un límite físico.
#     Pasarla invita al **flutter** (vibración aeroelástica), que puede desintegrar el planeador
#     en segundos. Cerca de la V~NE~, limita las deflexiones de mando a un tercio de su recorrido.
#  [5]
#     **Factor de carga y pérdida**: las Gs "engordan" al planeador. En un viraje de 60° (2 Gs),
#     la velocidad de pérdida sube un 41%.
#
# RECUADROS (5)
#  [Regla de oro 1]
#     En turbulencia fuerte, reduce enseguida la velocidad por debajo de la V~A~ para proteger la
#     estructura. Tu referencia visual está en el anemómetro: quédate en el arco verde, que
#     termina en la V~RA~ (velocidad máxima en aire turbulento). El arco amarillo, de la V~RA~ a
#     la V~NE~, es solo para aire en calma.
#  [Seguridad 2]
#     La V~A~ **no te protege de entradas combinadas simultáneas en más de un eje**. Los
#     requisitos de certificación cubren deflexiones completas en un único mando a la vez. Si
#     aplicas timón de profundidad a fondo y pedal a fondo **al mismo tiempo** —aunque estés por
#     debajo de V~A~— puedes generar una carga estructural que supere el límite de diseño. En
#     turbulencia, mantén los mandos suaves y evita movimientos bruscos coordinados en múltiples
#     ejes simultáneamente.
#  [Seguridad 3]
#     La V~NE~ disminuye con la altitud: en aire menos denso, la velocidad aerodinámica verdadera
#     (TAS) —de la que depende el flutter— aumenta respecto a la indicada (IAS) que lees en el
#     anemómetro. Presta atención a la tabla de correcciones de V~NE~ por altitud en la cabina.
#     Este efecto es crítico en el vuelo de onda, donde se alcanzan grandes altitudes; su relación
#     con la meteorología de onda se trata en el **Libro 3 — Meteorología**.
#  [Airmanship 4]
#     Cerca de la V~NE~, mantén las deflexiones de mando limitadas a aproximadamente **un tercio**
#     de su recorrido total. A esa velocidad, la presión dinámica es tan elevada que una deflexión
#     completa genera cargas que pueden superar la envolvente estructural incluso sin turbulencia.
#     No uses la V~NE~ como velocidad de crucero: es un límite absoluto de emergencia, no un
#     régimen habitual.
#  [Seguridad 5]
#     La velocidad de pérdida aumenta con el factor de carga. En un viraje de 60º (2 Gs), la
#     velocidad de pérdida **sube un 41%**. Un planeador que entra en pérdida a 70 km/h en vuelo
#     nivelado lo hará a casi 100 km/h en ese viraje cerrado. Un uso brusco de los mandos en esta
#     situación puede llevar a una pérdida crítica.
