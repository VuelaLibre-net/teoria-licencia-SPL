# Mazo Anki de 05-principios-vuelo, capítulo 1.
#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 05-principios-vuelo
capitulo: 1
titulo: "Aerodinámica (flujo de aire)"
tarjetas:
  - id: bernoulli-y-newton
    tipo: basica
    anverso: ¿Son Bernoulli y Newton **dos fuerzas** que se suman en la sustentación?
    reverso: |
      **No: son dos descripciones del mismo fenómeno.**

      El ala que acelera el aire por el extradós —bajando su presión— es la
      misma que desvía el aire hacia abajo en el borde de salida. Ambas miradas
      dan la misma fuerza.
    etiquetas: [Regla de oro]

  - id: capa-limite-tres-estados
    tipo: basica
    anverso: ¿Qué le pasa al ala según el estado de la **capa límite**?
    reverso: |
      * **Laminar** (ordenada): resistencia mínima. El santo grial de los
        veleros modernos.
      * **Turbulenta**: sube la resistencia, pero el ala **sigue sustentando**.
      * **Separada** del perfil: la sustentación se desploma. Eso es la pérdida.

  - id: centro-de-presiones
    tipo: basica
    anverso: ¿Qué es el **centro de presiones** y por qué complica la estabilidad?
    reverso: |
      **El punto donde se aplica la sustentación, y se mueve con el ángulo de
      ataque**: adelante con ángulos altos, atrás con ángulos bajos.

  - id: cg-delante-del-cp
    tipo: basica
    anverso: ¿Por qué se sitúa el **CG por delante del CP**?
    reverso: |
      **Para dar estabilidad longitudinal positiva.**

      La tendencia a picar que eso produce la contrarresta el estabilizador
      horizontal, generando una fuerza **descendente** que equilibra el cabeceo.
    etiquetas: [Seguridad]

  - id: resistencia-parasita-e-inducida
    tipo: basica
    anverso: Diferencia entre resistencia **parásita** e **inducida**.
    reverso: |
      **Parásita**: roce con el aire; **sube** con la velocidad.
      **Inducida**: el precio de generar sustentación; **baja** con la
      velocidad.

  - id: origen-de-la-inducida
    tipo: basica
    anverso: ¿De dónde sale la resistencia **inducida** y cómo se minimiza en un planeador?
    reverso: |
      **De los torbellinos de punta de ala, que inclinan el vector de
      sustentación.**

      Se minimiza con **alta razón de aspecto** (alas largas y estrechas) y
      **winglets**.

  - id: efecto-suelo
    tipo: basica
    anverso: ¿Qué es el **efecto suelo** y a qué altura aparece?
    reverso: |
      **Por debajo de una envergadura de altura sobre el terreno**, los vórtices
      de punta se comprimen, la resistencia inducida cae y el planeador flota.

  - id: efecto-suelo-en-la-toma
    tipo: basica
    anverso: Si el planeador «no quiere posarse» por efecto suelo, ¿qué **no** se hace?
    reverso: |
      **No picar el morro para forzar el aterrizaje.**

      Controla el planeo con los frenos aerodinámicos y déjalo posarse solo,
      asegurándote antes de tener pista suficiente.
    etiquetas: [Airmanship]


# ==========================================================================
# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
# ==========================================================================
#
# POST-IT (5 viñetas)
#  [1]
#     **Principio de Bernoulli**: la base del vuelo. El aire se acelera sobre la superficie curva
#     del ala (extradós) y su presión disminuye, generando una fuerza neta hacia arriba. Es la
#     misma sustentación que describe la deflexión del aire hacia abajo (Newton): dos miradas de
#     un único fenómeno, no dos fuerzas que se sumen.
#  [2]
#     **Capa límite**: esa fina capa de aire pegada al ala. Si es **laminar** (ordenada), la
#     resistencia es mínima: el santo grial de los veleros modernos. Si se vuelve **turbulenta**,
#     la resistencia sube, pero el ala sigue sustentando. Solo cuando el flujo se **separa** del
#     perfil la sustentación se desploma: eso es la pérdida.
#  [3]
#     **Centro de presiones (CP)**: el punto donde se aplica la fuerza de sustentación. Cuidado:
#     se mueve con el ángulo de ataque (adelante con altos ángulos, atrás con bajos), lo que
#     afecta a la estabilidad.
#  [4]
#     **Tipos de resistencia**: **parásita** (roce con el aire, sube con la velocidad) e
#     **inducida** (precio por generar sustentación, baja con la velocidad). La inducida viene de
#     los torbellinos de punta de ala que inclinan el vector de sustentación. Los planeadores la
#     minimizan con alta razón de aspecto (alas largas y estrechas) y winglets en las puntas.
#  [5]
#     **Efecto suelo**: por debajo de una envergadura de altura sobre el terreno, los vórtices de
#     punta se comprimen, la resistencia inducida cae y el planeador "flota" con más eficiencia de
#     la normal. Útil conocerlo: explica por qué en el aterrizaje el planeador no se posa si
#     entras rápido o largo.
#
# RECUADROS (3)
#  [Regla de oro 1]
#     La sustentación admite dos descripciones del **mismo** fenómeno, no dos fuerzas que se
#     sumen: la diferencia de presión (Bernoulli) y la deflexión del aire hacia abajo en el borde
#     de salida (acción-reacción, tercera ley de Newton). El ala que acelera el aire por arriba es
#     la misma que lo desvía hacia abajo; ambas miradas dan la misma fuerza.
#  [Seguridad 2]
#     Debido a la movilidad del CP, el diseño de la aeronave obliga a situar el centro de gravedad
#     (CG) por delante del centro de presiones en las condiciones normales de vuelo. Esa
#     configuración proporciona **estabilidad longitudinal positiva**. Para contrarrestar la
#     tendencia a picar (hundir el morro) que produce el CG adelantado, el estabilizador
#     horizontal genera una fuerza descendente que mantiene el equilibrio en cabeceo.
#  [Airmanship 3]
#     El efecto suelo puede sorprender al piloto inexperto: el planeador parece no querer posarse
#     durante la toma. Si estás entrando en la zona de contacto con exceso de velocidad o inercia,
#     resiste la tentación de picar el morro para forzar el aterrizaje. Usa los frenos
#     aerodinámicos para controlar el planeo y déjalo posarse solo cuando esté listo, asegurándote
#     antes de tener pista suficiente.
