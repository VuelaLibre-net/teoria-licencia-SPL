# Mazo Anki de 05-principios-vuelo, capítulo 7.
#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 05-principios-vuelo
capitulo: 7
titulo: "Picado en espiral (*spiral dive*)"
tarjetas:
  - id: espiral-vs-barrena-diagnostico
    tipo: basica
    anverso: ¿Cómo se distingue un **picado en espiral** de una **barrena**?
    reverso: |
      **Mirando el anemómetro.**

      Velocidad alta o creciendo → **espiral**: el planeador vuela y acelera.
      Velocidad baja y constante → **barrena**: el ala está en pérdida y no
      puede acelerar.

      La técnica de salida es opuesta: no las confundas.

  - id: instinto-en-la-espiral
    tipo: basica
    anverso: ¿Qué pasa si tiras de la palanca en una espiral **sin nivelar las alas**?
    reverso: |
      **Cierras más la espiral y aumentas las G hasta el fallo estructural.**

      Nunca tires para frenar un picado con las alas inclinadas.
    etiquetas: [Seguridad]

  - id: salida-de-espiral
    tipo: basica
    anverso: Secuencia de salida de un **picado en espiral**.
    reverso: |
      1. **Nivela las alas** (alerones y pie coordinados al lado contrario del
         viraje). Es lo primero: el alabeo sostiene la espiral.
      2. **Recupera suave** del picado.
      3. Si la velocidad se acerca a la V_NE, **frena con aerofrenos**, con
         suavidad.

  - id: causa-tipica-de-la-espiral
    tipo: basica
    anverso: ¿Cuál es la causa típica de un picado en espiral?
    reverso: |
      **Pérdida de referencia visual (nubes, noche) y distracción.**

      El planeador tiene tendencia espiral: si lo dejas solo con un pequeño
      alabeo, la espiral crece sola.


