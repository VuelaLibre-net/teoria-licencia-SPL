# Mazo Anki de 05-principios-vuelo, capítulo 2.
#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 05-principios-vuelo
capitulo: 2
titulo: "Mecánica de vuelo"
tarjetas:
  - id: el-motor-es-la-gravedad
    tipo: basica
    anverso: ¿Qué hace de «motor» en un planeador?
    reverso: |
      **La gravedad.** El planeador siempre cae a través de la masa de aire.

      Bajando el morro se convierte altura (energía potencial) en velocidad
      (cinética): la componente del peso hacia adelante actúa como tracción.

  - id: velocidad-y-altura-como-energia
    tipo: basica
    anverso: ¿Cómo se relacionan velocidad y altura como reservas de energía?
    reverso: |
      **La velocidad da el mando; la altura es la reserva.**

      Cediendo altura ganas velocidad, y gastando velocidad recuperas algo de
      trayectoria ascendente. Pero el intercambio dura poco: la reserva sólo se
      rellena subiendo en una ascendencia.
    etiquetas: [Regla de oro]

  - id: que-es-la-fineza
    tipo: basica
    anverso: ¿Qué significa una fineza (**L/D**) de 35:1?
    reverso: |
      **Que avanza 35 km por cada kilómetro de altura, en aire en calma.**

  - id: recortar-el-ld-publicado
    tipo: basica
    anverso: ¿Con qué **L/D** se planifican los tramos finales y las tomas fuera de campo?
    reverso: |
      **Con la mitad del publicado en el AFM.**

      Te protege cuando se suman el viento de cara, el aire que baja y la
      suciedad o los mosquitos del borde de ataque, que merman más de lo que
      parece.
    etiquetas: [Airmanship]

  - id: velocidad-de-transicion-y-viento
    tipo: basica
    anverso: ¿Cómo se ajusta la velocidad de transición al viento y al aire?
    reverso: |
      **Más rápido con viento de cara y en aire descendente; algo más despacio
      con viento de cola.**

  - id: lastre-de-agua-en-la-polar
    tipo: basica
    anverso: ¿Qué le hace el **lastre de agua** a la polar?
    reverso: |
      **La desplaza a la derecha: suben la velocidad de máximo planeo y la de
      mínimo descenso.**

      Ventajoso en condiciones fuertes y transiciones largas; penaliza en
      térmicas débiles. Se larga antes de aterrizar.

  - id: factor-de-carga-y-perdida-05
    tipo: basica
    anverso: ¿Cómo crece la velocidad de pérdida con el **factor de carga**?
    reverso: |
      **Con la raíz cuadrada de n.** En un viraje de 60º soportas **2 g** y la
      velocidad de pérdida sube un **41 %**.

      Si normalmente pierdes a 60 km/h, en ese viraje pierdes a 85 km/h, con el
      mando respondiendo con aparente normalidad.
    etiquetas: [Seguridad]

  - id: patron-letal-de-accidente
    tipo: basica
    anverso: ¿Cuál es el patrón más repetido en la estadística de accidentes de planeador?
    reverso: |
      **Maniobra de aterrizaje, altura escasa, velocidad baja y una pisada
      brusca de pedales con alabeo exagerado.**

      La pérdida llega sin avisar y a esa altura no hay margen.
    etiquetas: [Seguridad]


