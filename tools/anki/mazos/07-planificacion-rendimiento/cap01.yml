# POST-IT (6 viñetas)
#  [1]
#     **CG atrasado**: es la condición más peligrosa. El avión se vuelve inestable (quiere subir
#     el morro solo) y la recuperación de una pérdida o barrena puede ser imposible. Si eres
#     ligero, usa lastre fijado mecánicamente, nunca improvisado.
#  [2]
#     **CG adelantado**: el avión es muy estable (pesado de morro), pero menos eficiente por la
#     resistencia del timón de profundidad deflectado, y con una velocidad de pérdida más alta.
#  [3]
#     **Cálculo del CG**: CG = Σ Momentos / Σ Pesos. Cada peso se multiplica por su brazo
#     (distancia al *datum*) y la suma de momentos se divide entre la masa total. Los datos de
#     partida salen de la ficha de pesaje oficial.
#  [4]
#     **Peso máximo (MTOW)**: un planeador sobrecargado necesita más pista para despegar, tiene
#     una velocidad de pérdida mayor y sufre más fatiga estructural con menos Gs.
#  [5]
#     **Lastre de agua**: permite volar más rápido con el mismo ángulo de planeo (ideal para días
#     fuertes), pero empeora el régimen de ascenso en térmica. Y recuerda: el agua se tira antes
#     de aterrizar.
#  [6]
#     **Lastre de cola**: no añade rendimiento por sí mismo; recoloca el CG cuando llenas las
#     alas. Vacíalo siempre junto con los tanques principales: agua solo en la cola equivale a un
#     CG atrasado extremo.
#
# RECUADROS (3)
#  [Regla de oro 1]
#     Si pesas poco, usa lastre de plomo o pesas fijas. Nunca despegues sin comprobar que tu peso
#     entra en el margen permitido para el asiento que ocupas.
#  [Airmanship 2]
#     El lastre de cabina debe ir siempre fijado mecánicamente en los soportes que el fabricante
#     instala en el morro (planchas de plomo o pesas homologadas con su anclaje). Nunca improvises
#     con sacos de arena, mochilas u objetos sueltos: en una turbulencia o en la rotación del
#     despegue pueden desplazarse, bloquear los pedales o cambiar el centrado en el peor momento
#     posible.
#  [Seguridad 3]
#     Nunca aterrices con los tanques de agua llenos a menos que sea una emergencia absoluta. La
#     energía del impacto aumenta drásticamente con el peso, y podrías romper el planeador de
#     forma irreparable.
