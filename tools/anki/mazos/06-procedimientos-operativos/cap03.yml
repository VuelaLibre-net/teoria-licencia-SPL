# Mazo Anki de 06-procedimientos-operativos, capítulo 3.
#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 06-procedimientos-operativos
capitulo: 3
titulo: "Técnicas de planeo"
tarjetas:
  - id: centrado-de-termica
    tipo: basica
    anverso: Al atravesar una térmica, ¿hacia dónde se vira?
    reverso: |
      **Hacia el ala que sube: ahí está el núcleo.**

      Una vez establecido el giro, no inviertas nunca el sentido: ajusta. Cierra
      el viraje cuando el vario sube, ábrelo cuando baja.
    etiquetas: [Regla de oro]

  - id: hilo-lateral-limitaciones
    tipo: basica
    anverso: ¿Para qué sirve —y para qué no— el **hilo de lana lateral**?
    reverso: |
      **Es una ayuda didáctica para visualizar el ángulo de ataque en vuelo
      térmico lento.**

      En vuelo rápido pierde toda precisión: los ángulos de ataque son
      minúsculos. Nunca sustituye al anemómetro, al horizonte ni al hilo central
      de coordinación.
    etiquetas: [Seguridad]

  - id: anillo-maccready
    tipo: basica
    anverso: ¿Cómo se usa el **anillo MacCready**?
    reverso: |
      **Se pone en el valor de ascenso que esperas encontrar** (por ejemplo
      2 m/s) **y se vuela a la velocidad que marque.**

      Acelera en descendencias, aminora en ascendencias.

  - id: vuelo-de-ladera-preferencia
    tipo: basica
    anverso: En vuelo de ladera, ¿quién tiene preferencia y hacia dónde no se vira?
    reverso: |
      **Tiene preferencia quien lleva la ladera a su derecha. Nunca se vira
      hacia el monte.**

      Mantente pegado a barlovento, con vía de escape al valle siempre
      disponible.

  - id: no-virar-hacia-la-ladera
    tipo: basica
    anverso: ¿Qué hay a sotavento de la cresta que hace tan peligroso virar hacia la ladera?
    reverso: |
      **Aire descendiendo con violencia, incluso con condiciones aparentemente
      buenas en barlovento.**

      Una entrada accidental en rotor a baja altura sobre el terreno puede ser
      irrecuperable.
    etiquetas: [Seguridad]

  - id: vuelo-de-onda-donde-subir
    tipo: basica
    anverso: ¿Dónde se asciende en **onda**, y qué exige?
    reverso: |
      **En la zona laminar, delante de la nube de rotor.**

      Exige oxígeno, ropa de abrigo y altímetro calibrado. Cuidado al bajar: el
      rotor puede romper el planeador en segundos.

  - id: onda-y-espacio-aereo
    tipo: basica
    anverso: ¿Qué hay que consultar antes de un vuelo de onda planificado?
    reverso: |
      **El espacio aéreo**: es frecuente que las altitudes de onda coincidan con
      zonas restringidas o reservadas al tráfico controlado, que exigen
      autorización previa.
    etiquetas: [Airmanship]

  - id: lastre-y-velocidad-de-perdida
    tipo: basica
    anverso: ¿Cuánto sube la velocidad de pérdida con **lastre de agua**?
    reverso: |
      **Hasta 15-20 km/h.**

      Ajusta todas las velocidades de referencia —despegue, aproximación,
      circuito—. Nunca aterrices con lastre completo salvo avería del vaciado, y
      entonces extrema la suavidad: la inercia puede superar la resistencia
      estructural de las alas.
    etiquetas: [Seguridad]


