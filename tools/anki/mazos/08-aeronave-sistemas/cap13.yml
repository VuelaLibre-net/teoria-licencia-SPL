libro: 08-aeronave-sistemas
capitulo: 13
titulo: "Paracaídas de emergencia"
tarjetas:
  - id: plegado-y-vida-util
    tipo: basica
    anverso: ¿Cada cuánto se pliega un paracaídas y cuánta vida útil tiene?
    reverso: |
      **Plegado y aireación cada 6-12 meses según fabricante, por un *rigger*
      certificado**, y vida útil límite de 15 o 20 años, por ejemplo.

      Uno plegado hace una semana se abre mucho antes que uno plegado hace un
      año: no apures los plazos.
    etiquetas: [Regla de oro]

  - id: ajuste-del-arnes
    tipo: basica
    anverso: ¿Cómo debe ir ajustado el **arnés**?
    reverso: |
      **Ceñido al cuerpo, perneras apretadas y pecho cerrado.**

      Un arnés flojo convierte el tirón de apertura en lesión.

  - id: enemigos-del-paracaidas
    tipo: basica
    anverso: ¿Qué deteriora un paracaídas guardado?
    reverso: |
      **La luz UV, la humedad y la suciedad.**

      Llévalo siempre en su bolsa y no lo dejes tirado en la pista.

  - id: por-que-150-m
    tipo: basica
    anverso: ¿Por qué la altura mínima de salto son **150 m**?
    reverso: |
      **Porque la campana necesita entre 50 y 90 m para desplegarse del todo, y
      el abandono se come los primeros 100.**

      Por debajo, el margen es crítico.
    etiquetas: [Seguridad]


# ==========================================================================
# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
# ==========================================================================
#
# POST-IT (4 viñetas)
#  [1]
#     **Mantenimiento**: no es eterno. Pide plegado y aireación periódicos por un **rigger**
#     certificado (cada 6-12 meses según fabricante) y tiene una vida útil límite (15 o 20 años,
#     por ejemplo).
#  [2]
#     **Ajuste**: arnés ceñido al cuerpo, perneras apretadas, pecho cerrado. Un arnés flojo
#     convierte el tirón de apertura en lesión.
#  [3]
#     **Cuidado diario**: la luz UV, la humedad y la suciedad son sus enemigos. Llévalo siempre en
#     su bolsa y no lo dejes tirado en la pista.
#  [4]
#     **Secuencia**: cabina, cinturones, saltar, anilla. Mínimo recomendado: 150 m AGL. El
#     procedimiento completo se entrena con el **Libro 6 — Procedimientos operativos**, capítulo
#     8.
#
# RECUADROS (2)
#  [Regla de oro 1]
#     Un paracaídas plegado hace una semana se abre mucho antes que uno plegado hace un año. No
#     apures los plazos de revisión: esos segundos de diferencia en la apertura pueden ser vitales
#     a baja altura.
#  [Seguridad 2]
#     La altura mínima recomendada para un salto con garantías es de 150 metros sobre el terreno:
#     la campana necesita entre 50 y 90 metros para desplegarse del todo, y el abandono se come
#     los primeros 100. Por debajo de esa cota el margen es crítico. Si la emergencia ocurre alto,
#     no lo dudes: cada segundo de demora es altura perdida.
