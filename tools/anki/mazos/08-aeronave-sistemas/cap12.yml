#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 08-aeronave-sistemas
capitulo: 12
titulo: "Baterías (rendimiento y limitaciones operativas)"
tarjetas:
  - id: plomo-vs-lifepo4
    tipo: basica
    anverso: Compara baterías de **plomo-ácido/gel** y **LiFePO4**.
    reverso: |
      **Plomo/gel**: pesadas, robustas, baratas.
      **LiFePO4**: ligeras, voltaje constante, cargador específico.

  - id: fusible-junto-al-borne
    tipo: basica
    anverso: ¿Dónde va el **fusible** de la batería y por qué?
    reverso: |
      **Lo más cerca posible del borne.**

      Un cortocircuito en vuelo sin fusible es fuego en cabina en segundos.

  - id: fusibles-de-repuesto
    tipo: basica
    anverso: Si un fusible se funde en vuelo, ¿cuántas veces lo cambias?
    reverso: |
      **Una.** Si vuelve a fundirse, desconecta el equipo afectado: tienes un
      cortocircuito serio que puede acabar en fuego eléctrico.

      Lleva repuestos en el bolsillo de la cabina.
    etiquetas: [Regla de oro]

  - id: baterias-y-frio
    tipo: basica
    anverso: ¿Qué le hace el frío a la batería?
    reverso: |
      **Le hace perder capacidad de golpe.**

      Una que parece llena en tierra puede morirse rápido en onda a −20 ºC.

  - id: bateria-para-vuelo-en-nubes
    tipo: basica
    anverso: ¿Con qué carga se despega para volar en nubes?
    reverso: |
      **Con las baterías prácticamente llenas.**

      Sin referencias visuales, los instrumentos son tu vida.

  - id: sujecion-de-la-bateria
    tipo: basica
    anverso: ¿Qué fuerzas debe aguantar el **soporte de la batería**?
    reverso: |
      **15 g hacia delante, 9 g hacia abajo, 7,5 g hacia arriba y 6 g lateral.**

      Nada de gomas elásticas ni montajes improvisados: soportes o cinchas
      aprobados por el fabricante, comprobados en cada prevuelo. La batería es
      un proyectil de varios kilos.

      *Fundamento: CS 22.561(d), con las fuerzas de CS 22.561(b)(1).*
    etiquetas: [Normativa]


