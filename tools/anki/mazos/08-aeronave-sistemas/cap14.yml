# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 08-aeronave-sistemas
capitulo: 14
titulo: "Equipo de evacuación de emergencia (*emergency bail-out aid*)"
tarjetas:
  - id: elt-plb-406
    tipo: basica
    anverso: ¿Qué frecuencia debe emitir tu baliza, y por qué?
    reverso: |
      **406 MHz, y registrada oficialmente.**

      Las de 406 con GPS mandan la posición exacta al satélite en minutos. Las
      antiguas de 121,5 MHz ya no se vigilan por satélite: sólo sirven para el
      rastreo cercano (*homing*).
    etiquetas: [Normativa]

  - id: sao-op-150-08
    tipo: basica
    anverso: ¿Quién decide si se usa **oxígeno suplementario**, y con qué criterio por defecto?
    reverso: |
      **El piloto al mando, que debe garantizar su uso cuando determine que su
      falta puede deteriorar las facultades de los ocupantes.**

      Si no puede valorarlo, el criterio por defecto es **oxígeno siempre que la
      altitud de presión supere los 10.000 ft**.

      *Fundamento: Part-SAO, SAO.OP.150, y su AMC1.*
    etiquetas: [Normativa]

  - id: eds-ahorro
    tipo: basica
    anverso: ¿Qué aportan los sistemas **EDS** de oxígeno?
    reverso: "**Ahorran mucho oxígeno: sólo entregan a demanda.**"

  - id: kit-de-supervivencia-08
    tipo: basica
    anverso: ¿Qué lleva el kit de supervivencia y cómo hay que vestirse?
    reverso: |
      **Agua, abrigo, espejo de señales y móvil cargado.**

      Vístete para la temperatura de fuera, no para la de cabina: en una ladera
      remota pueden tardar horas o días en sacarte.


# ==========================================================================
# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
# ==========================================================================
#
# POST-IT (3 viñetas)
#  [1]
#     **ELT / PLB**: tu baliza de salvación. Las de 406 MHz con GPS mandan tu posición exacta al
#     satélite en minutos. Las antiguas de 121.5 MHz ya no se vigilan por satélite.
#  [2]
#     **Oxígeno**: la regla es SAO.OP.150: el piloto valora el riesgo de hipoxia; si no puede
#     valorarlo, oxígeno siempre por encima de 10.000 ft (AMC1). Los sistemas EDS (a demanda)
#     ahorran mucho oxígeno. La fisiología se estudia en el **Libro 2 — Factores humanos**,
#     capítulo 4.
#  [3]
#     **Kit de supervivencia**: agua, abrigo, espejo de señales, móvil cargado. Si aterrizas en
#     una ladera remota, pueden tardar horas o días en sacarte. Vístete para la temperatura de
#     fuera, no para la de cabina.
#
# RECUADROS (2)
#  [Normativa 1]
#     Asegúrate de que tu baliza emite en 406 MHz. Las antiguas señales de 121.5 MHz ya no se
#     vigilan por satélite; solo sirven para el rastreo cercano (*homing*) de los equipos de
#     rescate. Y la baliza debe estar registrada oficialmente.
#  [Normativa 2]
#     **SAO.OP.150 (uso de oxígeno suplementario)**: «El piloto al mando se asegurará de que todas
#     las personas a bordo utilicen oxígeno suplementario siempre que determine que, a la altitud
#     del vuelo previsto, la falta de oxígeno podría provocar un deterioro de sus facultades o
#     afectarles perjudicialmente.» El **AMC1 SAO.OP.150** concreta el criterio: cuando el piloto
#     no pueda valorar ese efecto, debe garantizar que todos los ocupantes usan oxígeno durante
#     cualquier período en que la altitud de presión supere los 10.000 ft.
