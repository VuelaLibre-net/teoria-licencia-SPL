# Mazo Anki de 08-aeronave-sistemas, capítulo 1.
#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 08-aeronave-sistemas
capitulo: 1
titulo: "Estructura (*airframe*)"
tarjetas:
  - id: materiales-del-planeador
    tipo: basica
    anverso: ¿Qué materiales se usan en los planeadores y qué daños conviene buscar?
    reverso: |
      **La mayoría de los modernos usan composites de vidrio o carbono.**

      En madera y tela: humedad, deformaciones, costuras abiertas, desgarros o
      zonas destensadas. En metal: corrosión, grietas y abolladuras nuevas.

  - id: por-que-son-blancos
    tipo: basica
    anverso: ¿Por qué son blancos los planeadores de composite?
    reverso: |
      **Porque la resina epoxi pierde propiedades mecánicas si se calienta
      demasiado**, y el blanco refleja la radiación solar.

      Es una razón técnica, no estética.
    etiquetas: [Airmanship]

  - id: gelcoat
    tipo: basica
    anverso: ¿Qué es el **gelcoat** y cómo se cuida?
    reverso: |
      **Una capa exterior de resina que alisa la superficie y ayuda a proteger
      el laminado.** El sol y los cambios de temperatura favorecen el craqueado.

      Protégelo con fundas y consulta el manual antes de encerar o pulir.
    etiquetas: [Regla de oro]

  - id: gelcoat-vs-poliuretano
    tipo: basica
    anverso: ¿Se cuidan igual la pintura de **poliuretano** y el gelcoat?
    reverso: |
      **No. Son acabados distintos y no se limpian, pulen ni reparan siempre con
      los mismos productos.** Hay que seguir el manual de mantenimiento.

  - id: larguero
    tipo: basica
    anverso: ¿Qué es el **larguero** y qué pasa si se daña?
    reverso: |
      **Es el principal elemento resistente longitudinal del ala y soporta buena
      parte de las cargas de flexión.** No trabaja solo: el revestimiento y otros
      elementos también comparten cargas.

      Ante un daño real o sospechado, el planeador queda fuera de servicio hasta
      que personal competente lo evalúe.

  - id: estructura-sandwich
    tipo: basica
    anverso: ¿Qué es una **estructura sándwich** y cuál es su punto débil?
    reverso: |
      **Dos capas duras con un núcleo ligero (espuma o nido de abeja): muy
      rígida y ligera.**

      Delicada ante los golpes puntuales.

  - id: gancho-de-morro-vs-cg
    tipo: basica
    anverso: ¿Cómo se elige el gancho para avión o torno?
    reverso: |
      **Lo indican el AFM y las placas del planeador.**

      La disposición habitual es morro para avión y CG para torno. El gancho
      destinado al torno debe tener suelta automática (*back-release*).

  - id: por-que-no-torno-con-gancho-de-morro
    tipo: basica
    anverso: ¿Por qué un gancho de morro Tost E 85 normal no sirve para torno?
    reverso: |
      **Porque no incorpora la suelta automática (*back-release*) exigida para
      el lanzamiento por torno.** Usa siempre el gancho autorizado por el AFM y
      las placas para ese método.
    etiquetas: [Seguridad]

  - id: vida-del-gancho-tost
    tipo: basica
    anverso: ¿Qué se comprueba y cómo se controla la vida del gancho de remolque?
    reverso: |
      **En prevuelo: acciona la suelta con el cable de pruebas y comprueba que
      abre y cierra con franqueza, sin agarrotamientos.**

      Sus revisiones se controlan por tiempo y número de actuaciones, conforme
      al programa de mantenimiento y a las instrucciones del fabricante.
    etiquetas: [Seguridad]

  - id: cupula-cuidados
    tipo: basica
    anverso: ¿Qué se comprueba y cómo se cuida la **cúpula**?
    reverso: |
      **Pestillos bloqueados y mandos de salida de emergencia localizados.** La
      secuencia se aprende en tierra con el AFM y el instructor.

      El plexiglás se limpia con agua o productos aprobados y un paño suave, sin
      frotar en seco.


# ==========================================================================
# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
# ==========================================================================
#
# POST-IT (6 viñetas)
#  [1]
#     **Materiales**: los composites dominan en los veleros modernos. En madera y tela, busca
#     humedad, deformaciones y daños del revestimiento; en metal, corrosión, grietas y
#     abolladuras nuevas.
#  [2]
#     **Gelcoat y pintura**: protegen y alisan la superficie, pero no se cuidan igual. Usa fundas,
#     limpia con suavidad y consulta el manual antes de encerar, pulir o reparar.
#  [3]
#     **Larguero**: es el principal elemento resistente del ala, aunque no trabaja solo. Si
#     sospechas que está dañado, el planeador queda fuera de servicio hasta que lo evalúe personal
#     competente.
#  [4]
#     **Estructura sándwich**: dos capas duras con un núcleo ligero (espuma o nido de abeja). Muy
#     rígida y ligera, pero delicada ante los golpes puntuales.
#  [5]
#     **Cúpula**: pestillos bloqueados antes de despegar, mandos de salida localizados y
#     procedimiento del AFM aprendido en tierra. Limpia el plexiglás con productos admitidos por
#     el fabricante.
#  [6]
#     **Gancho de remolque**: usa el autorizado por el AFM y las placas para cada método. El
#     destinado al torno debe tener suelta automática (**back-release**). Comprueba su
#     funcionamiento en la inspección prevuelo.
#
# RECUADROS (4)
#  [Airmanship 1]
#     Los planeadores de composite son casi siempre blancos por una razón técnica, no estética: la
#     resina epoxi que une las fibras pierde propiedades mecánicas si se calienta demasiado. El
#     blanco refleja la radiación solar y mantiene la estructura dentro de sus límites térmicos.
#  [Regla de oro 2]
#     Protege la superficie del sol con fundas y límpiala sin frotar en seco. Para encerar o pulir,
#     usa únicamente productos y métodos admitidos por el fabricante: lo que funciona en un
#     gelcoat puede estropear una pintura de poliuretano.
#  [Seguridad 3]
#     En un lanzamiento por torno, usa únicamente el gancho que autorice el AFM y que disponga de
#     suelta automática (**back-release**). Un gancho de morro Tost E 85 normal no la tiene y no
#     sirve para torno. Comprueba el manual y las placas antes de conectar el cable.
#  [Seguridad 4]
#     El gancho de remolque se desgasta y tiene revisiones propias. Controla sus plazos conforme al
#     programa de mantenimiento y a las instrucciones del fabricante. En la inspección prevuelo,
#     prueba la suelta y comprueba que el mecanismo abre y cierra con franqueza, sin
#     agarrotamientos.
