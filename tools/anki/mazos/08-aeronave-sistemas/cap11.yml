#
# POST-IT (4 viñetas)
#  [1]
#     **Para qué sirve**: aumentar la carga alar y desplazar la polar a la derecha (correr más con
#     el mismo ángulo de planeo). Solo merece la pena con térmicas fuertes.
#  [2]
#     **Riesgo de hielo**: el agua se expande al congelarse. Si subes por encima de la isocero,
#     puede reventar la estructura interna del ala. Vacía antes de subir.
#  [3]
#     **Vaciado asimétrico**: si una válvula falla y te quedas con agua en un solo ala, tienes una
#     emergencia grave de control lateral. Aterriza con velocidad extra y cuidado: el avión querrá
#     alabear hacia el ala pesada.
#  [4]
#     **Antes de aterrizar**: tira el agua. Aterrizar con lastre castiga el tren y la estructura
#     sin necesidad, y sube la velocidad de toma.
#
# RECUADROS (1)
#  [Seguridad 1]
#     Vacía el lastre de agua antes de aterrizar; es una limitación operativa del Manual de Vuelo.
#     El planeador no está diseñado para encajar las cargas de impacto de una toma con los tanques
#     llenos. Además, aterrizar con agua alarga mucho la carrera de frenado y aumenta el riesgo de
#     daños estructurales si chocas contra un obstáculo.
