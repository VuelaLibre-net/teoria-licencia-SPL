libro: 08-aeronave-sistemas
capitulo: 11
titulo: "Sistemas de lastre con agua (*water ballast systems*)"
tarjetas:
  - id: para-que-el-lastre-de-agua-08
    tipo: basica
    anverso: ¿Para qué sirve el **lastre de agua** y cuándo compensa?
    reverso: |
      **Aumenta la carga alar y desplaza la polar a la derecha: corres más con
      el mismo ángulo de planeo.**

      Sólo merece la pena con térmicas fuertes.

  - id: lastre-y-isocero
    tipo: basica
    anverso: ¿Por qué hay que vaciar el lastre antes de subir por encima de la **isocero**?
    reverso: |
      **Porque el agua se expande al congelarse y puede reventar la estructura
      interna del ala.**

  - id: vaciado-asimetrico-08
    tipo: basica
    anverso: Si falla una válvula y queda agua en un solo ala, ¿qué tienes?
    reverso: |
      **Una emergencia grave de control lateral.**

      Aterriza con velocidad extra y cuidado: el planeador querrá alabear hacia
      el ala pesada.

  - id: por-que-no-aterrizar-con-agua
    tipo: basica
    anverso: ¿Por qué es una limitación del AFM vaciar el agua antes de aterrizar?
    reverso: |
      **Porque el planeador no está diseñado para encajar las cargas de impacto
      con los tanques llenos.**

      Además alarga mucho la carrera de frenado y aumenta el riesgo de daño
      estructural contra un obstáculo.
    etiquetas: [Seguridad]


# ==========================================================================
# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
