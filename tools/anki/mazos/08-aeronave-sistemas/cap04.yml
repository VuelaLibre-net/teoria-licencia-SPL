#
# POST-IT (5 viñetas)
#  [1]
#     **MTOW y masa sin agua**: dos límites distintos. El agua en las alas no castiga la raíz del
#     ala como el peso en cabina.
#  [2]
#     **Límites de CG**: adelantado, mandos pesados y recogida corta; retrasado, inestable y
#     barrena potencialmente irrecuperable. El trasero es el peligroso.
#  [3]
#     **Lastre fijo**: placas de plomo en el morro para corregir un CG atrasado (piloto ligero).
#     Si no llegas al peso mínimo de la placa de limitaciones, lastre obligatorio.
#  [4]
#     **Lastre de cola**: depósito de agua o pesas en la deriva para ajustar el CG óptimo.
#     Cuidado: olvidar vaciarlo con un piloto ligero delante es una emergencia grave (CG
#     peligrosamente atrasado).
#  [5]
#     **Pesaje**: tras reparaciones, repintado o cambios de equipo, según el manual de
#     mantenimiento. El resultado vive en el Certificado de Pesaje.
#
# RECUADROS (2)
#  [Normativa 1]
#     La certificación CS-22 exige una placa de limitaciones visible en cabina con las cargas
#     mínima y máxima del asiento. Comprueba siempre el peso mínimo en cabina: si el tuyo (con
#     paracaídas y ropa) queda por debajo de ese mínimo, es obligatorio instalar lastre antes de
#     despegar, según indique el Manual de Vuelo.
#  [Airmanship 2]
