libro: 08-aeronave-sistemas
capitulo: 5
titulo: "Mandos de vuelo"
tarjetas:
  - id: mandos-primarios-y-transmision
    tipo: basica
    anverso: ¿Qué mueve cada mando primario y cómo se transmite?
    reverso: |
      **Alerones (alabeo), profundidad (cabeceo) y dirección (guiñada).**

      Varillas rígidas para alabeo y profundidad; **cables** para la dirección.
      Revisa holguras, tensión y deshilachados en la inspección.

  - id: codigo-de-colores-cs22780
    tipo: cloze
    texto: |
      Código de colores de cabina (**CS 22.780**): {{c1::azul}} para los
      aerofrenos, {{c2::verde}} para el compensador, {{c3::amarillo}} para la
      suelta de remolque y {{c4::rojo}} para la suelta de cúpula.
    extra: |
      El blanco queda para la apertura normal de cúpula; si una sola palanca
      hace las dos cosas, manda el rojo. La norma **reserva** el amarillo y el
      rojo: ningún otro mando puede llevarlos, y por eso el ojo puede fiarse.
      CS 22.1555 obliga a marcarlos.

  - id: aerofrenos-efecto
    tipo: basica
    anverso: ¿Qué hacen los **aerofrenos** y qué efecto tienen sobre la actitud?
    reverso: |
      **Destruyen sustentación y aumentan resistencia para controlar la senda.**

      Al sacarlos el morro tiende a bajar y el planeador puede vibrar:
      anticípate y compensa con profundidad para no perder la velocidad de
      aproximación.
    etiquetas: [Airmanship]

  - id: flaps-positivos-y-negativos
    tipo: basica
    anverso: ¿Cuándo se usan **flaps** positivos y negativos?
    reverso: |
      **Positivos para térmica y aterrizaje; negativos para transiciones
      rápidas.**

      Sólo en veleros de rendimiento.

  - id: que-hace-el-compensador
    tipo: basica
    anverso: ¿Qué hace —y qué no hace— el **compensador**?
    reverso: |
      **Alivia la presión de palanca para una velocidad dada. No vuela el
      avión.**

      Se ajusta en cada fase del vuelo. Mando verde.

  - id: libertad-y-sentido-de-mandos
    tipo: basica
    anverso: ¿Qué se comprueba de los mandos antes de cada despegue?
    reverso: |
      **Libertad y sentido**: llévalos a sus topes y verifica **a la vista** que
      las superficies se mueven en la dirección correcta.

      Un mando invertido tras un mantenimiento es una emergencia crítica y se
      manifiesta justo al despegar.
    etiquetas: [Seguridad]


