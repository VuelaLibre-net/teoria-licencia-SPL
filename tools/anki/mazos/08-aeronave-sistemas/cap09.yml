# Mazo Anki de 08-aeronave-sistemas, capítulo 9.
#
# Fuente canónica: se edita a mano. `extraer.py` sólo crea el esqueleto y
# vuelca el material al pie; no vuelve a tocar este fichero.
#
# Cada tarjeta: id (slug estable, NO renombrar: es la identidad de la nota
# en la colección del alumno), tipo (basica|cloze), y los campos.
libro: 08-aeronave-sistemas
capitulo: 9
titulo: "Aeronavegabilidad y mantenimiento"
tarjetas:
  - id: inspeccion-diaria
    tipo: basica
    anverso: ¿De quién es la **inspección diaria** y qué incluye?
    reverso: |
      **Del piloto.**

      Presión de ruedas, estado del gancho de remolque, bisagras de mandos, y
      limpieza de pitot y estáticas.

  - id: cofa-vs-arc
    tipo: basica
    anverso: Diferencia entre **CofA** y **ARC**.
    reverso: |
      **El CofA es vitalicio; el ARC dura un año.**

      Sin ARC en vigor, el avión no vuela.

  - id: prorrogas-del-arc
    tipo: basica
    anverso: ¿Cuántas veces puede prorrogarse el **ARC**, y con qué condición?
    reverso: |
      **Dos veces consecutivas, un año cada vez, si la aeronave ha permanecido
      en entorno controlado**: gestión continua por una CAMO/CAO y mantenimiento
      por organizaciones aprobadas.

      Tras esas dos prórrogas, revisión de aeronavegabilidad completa.

      *Fundamento: Part-ML, ML.A.901.*
    etiquetas: [Normativa]

  - id: suelo-del-mantenimiento-programado
    tipo: basica
    anverso: ¿Cuál es el mínimo de inspección si el AMP se basa en el Programa Mínimo de Part-ML?
    reverso: |
      **Una inspección anual o cada 100 h, lo que antes se cumpla**
      (**ML.A.302**).

      La frecuencia concreta la fija el AMP según el fabricante, pero nunca
      puede ser menos restrictiva que ese suelo.
    etiquetas: [Normativa]

  - id: mantenimiento-piloto-propietario
    tipo: basica
    anverso: ¿Quién puede firmar las tareas de **mantenimiento de piloto-propietario**?
    reverso: |
      **El propietario o copropietario legal con licencia de piloto válida**, y
      sólo las tareas sencillas que la norma enumera.

      Todas quedan registradas y firmadas en el Diario de la Aeronave, con el
      número de licencia.

      *Fundamento: Part-ML, ML.A.803 y su Apéndice II.*
    etiquetas: [Normativa]

  - id: reporte-de-defectos
    tipo: basica
    anverso: ¿Por qué se anota cualquier defecto, por pequeño que parezca?
    reverso: |
      **Porque el siguiente piloto puede no verlo y matarse** — un cable de
      timón deshilachado, por ejemplo.


# ==========================================================================
# MATERIAL DE ORIGEN — no lo lee ninguna herramienta, es para redactar.
# ==========================================================================
#
# POST-IT (5 viñetas)
#  [1]
#     **Inspección diaria (DI)**: es cosa del piloto. Sigue la lista: presión de ruedas, estado
#     del gancho de remolque, bisagras de mandos, limpieza de pitot y estática.
#  [2]
#     **CofA y ARC**: el CofA es vitalicio; el ARC dura un año y se prorroga dos veces en entorno
#     controlado (ML.A.901). Sin ARC en vigor, el avión no vuela.
#  [3]
#     **Mantenimiento programado**: la frecuencia concreta de inspecciones (por tiempo, ciclos u
#     horas) la fija el AMP, según lo que diga el fabricante. Pero hay un suelo: si el AMP se basa
#     en el Programa Mínimo de Inspección de Part-ML (ML.A.302), nunca puede ser menos restrictivo
#     que **una inspección anual o cada 100 h, lo que antes se cumpla**.
#  [4]
#     **Mantenimiento por piloto-propietario**: tareas sencillas del Apéndice II de Part-ML, solo
#     si eres propietario con licencia válida, y siempre registradas y firmadas (ML.A.803).
#  [5]
#     **Reporte de defectos**: si rompes algo o ves algo raro, anótalo. El siguiente piloto puede
#     no verlo y matarse (un cable de timón deshilachado, por ejemplo).
#
# RECUADROS (2)
#  [Normativa 1]
#     Según **ML.A.901**, el ARC tiene validez anual, pero puede prorrogarse dos veces
#     consecutivas (un año cada vez) sin revisión completa si la aeronave ha permanecido en un
#     **entorno controlado**: gestión continua por una CAMO/CAO y mantenimiento hecho por
#     organizaciones aprobadas. Tras esas dos prórrogas toca revisión de aeronavegabilidad
#     completa.
#  [Normativa 2]
#     Solo puedes firmar tareas de piloto-propietario si eres el propietario (o copropietario)
#     legal de la aeronave y tienes una licencia de piloto válida (ML.A.803). Y todas las tareas
#     deben quedar registradas y firmadas en el Diario de la Aeronave, con tu número de licencia.
