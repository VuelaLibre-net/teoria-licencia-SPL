# Léxico de pronunciación del audiolibro: cómo se DICE cada sigla o palabra
# que el motor de voz leería mal. Lo aplica tools/audio/normalizar.py antes de
# sintetizar, así que el guion (`build/audio/guion/…/capNN.txt`) muestra ya lo
# que suena.
#
# Para corregir una pronunciación: añade o cambia la entrada y vuelve a lanzar
# `make audio NN capNN`. Sólo se sintetizan de nuevo los fragmentos que la usan.
#
# Escritura de las lecturas: ortografía española, con tilde donde cae el acento
# («nótam», «méidei»). Una sigla que se deletrea se escribe letra a letra.
# Las siglas que no estén aquí se leen como palabra si son pronunciables
# (4+ letras sin tres consonantes seguidas) y si no se deletrean; `sembrar.py`
# lista las que faltan.

